<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#fbf8f1">
<title>業績總覽｜靈應壇 × 神奇身心靈學苑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  --ivory:#fbf8f1;--paper:#fffdf8;--ink:#2b2418;--sub:#86796a;--faint:#b3a690;--line:#ebe2cf;
  --gold:#b08d47;--gold-d:#7d5f26;--gold-l:#e9d6a0;
  --foil:linear-gradient(100deg,#7a5b22 0%,#b8913f 24%,#ecd58f 46%,#c29a45 64%,#7a5b22 100%);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --num:"Cormorant Garamond","Noto Serif TC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --main:#b3862a;--dark:#6f500f;--glow:#f6dc98;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100svh;overflow-x:hidden;color:var(--ink);font:15px/1.65 var(--sans);
  text-wrap:pretty;font-variant-numeric:lining-nums;
  background:
   radial-gradient(120% 60% at 50% -10%,rgba(236,213,143,.38),transparent 60%),
   radial-gradient(80% 50% at 110% 110%,rgba(236,213,143,.22),transparent 60%),
   var(--ivory);}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3,p{margin:0}
.nowrap{white-space:nowrap}
.foil{background:var(--foil);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:foil 8s ease-in-out infinite}
@keyframes foil{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.num{font-family:var(--num);font-weight:600;font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em;white-space:nowrap}

/* 細金線邊框（全站統一的「帖」） */
.pane{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 20px;
  box-shadow:0 1px 0 #fff inset,0 18px 36px -26px rgba(110,80,25,.45)}
.pane::before{content:"";position:absolute;inset:4px;border:1px solid rgba(176,141,71,.28);border-radius:14px;pointer-events:none}
.pane::after{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4.5px;transform:rotate(45deg);
  background:var(--paper);border:1px solid var(--gold);pointer-events:none}
.pane+.pane,.gap{margin-top:16px}
.pane-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.pane-h h2{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.pane-h small{color:var(--faint);font-size:12px;white-space:nowrap}

/* ===================== 登入 ===================== */
.login{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));max-width:440px;margin:0 auto}
.login-head{text-align:center;margin-bottom:22px}
.crest{width:54px;height:54px;margin:0 auto 10px;display:block}
.login-head .org{font-family:var(--serif);font-size:13px;letter-spacing:.24em;color:var(--sub);white-space:nowrap}
.login-head h1{font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:.2em;margin:4px 0 0 .2em;line-height:1.3}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;color:var(--gold)}
.rule::before,.rule::after{content:"";width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{transform:scaleX(-1)}
.rule i{width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--gold)}
.login .pane{padding:26px 22px 22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;letter-spacing:.08em;color:#5d4d33;margin:0 2px 7px}
.inbox{position:relative}
.inbox svg{position:absolute;left:15px;top:50%;width:19px;height:19px;margin-top:-9.5px;color:#b19d78;pointer-events:none}
.inbox input{display:block;width:100%;height:54px;border:1px solid #e3d8c0;border-radius:13px;background:#fffefb;
  padding:0 50px 0 46px;font-size:17px;outline:none;transition:border-color .2s,box-shadow .2s}
.inbox input::placeholder{color:#b9ad97}
.inbox input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(176,141,71,.14)}
#pw{-webkit-text-security:disc}
.eye{position:absolute;right:5px;top:5px;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#a8957a}
.eye svg{position:static;margin:0;width:20px;height:20px}
.err{display:none;align-items:center;gap:8px;margin:2px 0 12px;padding:10px 12px;border-radius:11px;background:#fdf1ee;border:1px solid #f1d2ca;color:#a8473b;font-size:14px}
.err.on{display:flex}
.err svg{width:17px;height:17px;flex:none}
.btn-gold{position:relative;overflow:hidden;width:100%;height:54px;border-radius:14px;font-size:17px;font-weight:700;letter-spacing:.24em;
  color:#2c1d05;background:linear-gradient(100deg,#c39b4c,#e8cf8a 45%,#f6e7b8 55%,#d1ac5c);border:1px solid #a5823e;
  box-shadow:0 10px 22px -10px rgba(140,100,35,.7),inset 0 1px 0 rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-gold::after{content:"";position:absolute;top:0;bottom:0;left:-70px;width:50px;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-70px}100%{left:110%}}
.btn-gold:active{transform:scale(.985)}
.btn-gold:disabled{opacity:.7}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(44,29,5,.25);border-top-color:#2c1d05;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.login-foot{text-align:center;color:var(--faint);font-size:12px;margin-top:16px;letter-spacing:.06em}

/* ===================== 登入後 ===================== */
.app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 14px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .crest{width:38px;height:38px;margin:0;flex:none}
.who b{display:block;font-family:var(--serif);font-size:17px;letter-spacing:.12em;white-space:nowrap}
.who span{display:block;font-size:12px;color:var(--sub);white-space:nowrap}
.ghost{min-height:44px;padding:0 14px;border-radius:12px;color:var(--sub);font-size:14px;white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.6)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:#efe8da;margin-bottom:16px}
.seg button{height:42px;border-radius:11px;font-size:15px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--gold-d);font-weight:700;box-shadow:0 2px 8px -3px rgba(110,80,25,.35),inset 0 0 0 1px var(--gold-l)}

/* 會員卡 */
.card{position:relative;overflow:hidden;border-radius:22px;padding:20px 22px 18px;color:#fff;
  background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(135deg,var(--main),var(--dark));
  box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 22px 36px -20px var(--dark)}
.card::before{content:"";position:absolute;inset:7px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);border-radius:16px;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.3) 48%,transparent 60%);transform:translateX(-120%);animation:sheen 1.8s .3s ease-out forwards;pointer-events:none}
@keyframes sheen{to{transform:translateX(120%)}}
.card svg.g{position:absolute;right:-60px;top:-70px;width:300px;height:300px;opacity:.28;pointer-events:none}
.card>*{position:relative}
.c1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c-tag{font-family:var(--serif);font-size:12px;letter-spacing:.4em;color:var(--glow)}
.c-rank{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:.16em;white-space:nowrap}
.c-emb{width:50px;height:50px;color:var(--glow);flex:none}
.c-name{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.2em;margin:12px 0 10px;white-space:nowrap}
.c-lab{font-size:12px;letter-spacing:.14em;color:var(--glow)}
.c-cum{font-size:34px;line-height:1.1}
.c-cum small{font-family:var(--sans);font-size:13px;font-weight:500;margin-right:6px;letter-spacing:.06em}
.c-prog{margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--glow) 40%,transparent)}
.c-bar{height:5px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.c-bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--glow),#fff);transition:width 1.2s .4s cubic-bezier(.2,.7,.2,1)}
.c-note{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:13px;color:color-mix(in srgb,#fff 88%,var(--glow))}
.c-note b{font-weight:600}

/* 月份 */
.month{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px}
.mb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--gold-d);box-shadow:0 4px 12px -8px rgba(110,80,25,.6)}
.mb:disabled{opacity:.3;box-shadow:none}
.mb svg{width:18px;height:18px}
.mtext{text-align:center}
.mtext .num{font-size:28px;color:var(--gold-d);line-height:1.1}
.mtext small{display:block;font-size:12px;color:var(--faint)}

/* 本月 */
.kpi-lab{font-size:14px;color:var(--sub);letter-spacing:.08em}
.kpi{font-size:50px;line-height:1.05;margin-top:2px}
.kpi small{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--gold);margin-right:8px;-webkit-text-fill-color:var(--gold)}
.duo{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.duo>div+div{padding-left:16px;border-left:1px solid var(--line)}
.duo .k{font-size:13px;color:var(--sub)}
.duo .v{font-size:27px;color:var(--ink);line-height:1.25}
.duo .h{font-size:12px;color:var(--faint)}
.warn{display:flex;gap:9px;align-items:flex-start;margin-bottom:14px;padding:11px 13px;border-radius:12px;background:#fcf4df;border:1px solid #ecd9a2;color:#7a5a16;font-size:14px}
.warn svg{width:18px;height:18px;flex:none;margin-top:2px}

/* 列表 */
.row{padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:2px}
.row .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row .nm{font-weight:600;white-space:nowrap}
.row .nm small{font-weight:400;color:var(--faint);font-size:13px;margin-left:6px}
.row .num{font-size:20px}
.bar{height:4px;border-radius:9px;background:#f0e9db;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#b08d47,#e7cf8b)}
.person{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0;padding-top:2px}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:#fff;font-size:17px;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--gold-l)}
.person .mid{flex:1;min-width:0}
.person .mid b{display:block;font-weight:600;white-space:nowrap}
.person .mid span{display:block;font-size:13px;color:var(--sub);white-space:nowrap}
.person .num{font-size:20px}
.empty{text-align:center;padding:18px 0 8px;color:var(--sub)}
.empty b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:4px}

/* 全公司 */
.total .num{font-size:46px;line-height:1.05}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:16px}
.pod{text-align:center;border-radius:16px;padding:14px 4px 12px;background:linear-gradient(180deg,#fffdf8,#f7efdd);border:1px solid var(--line)}
.pod.p1{padding-top:20px;background:linear-gradient(180deg,#fffaf0,#f3e3b6);border-color:#e2c983}
.medal{width:40px;height:40px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:20px;color:#fff;box-shadow:0 0 0 3px #fff,0 6px 12px -6px rgba(0,0,0,.4)}
.m1{background:linear-gradient(135deg,#f6dd8d,#b88a2c)}.m2{background:linear-gradient(135deg,#e8ecf1,#8b96a5)}.m3{background:linear-gradient(135deg,#efc8a2,#a5673a)}
.pod b{display:block;font-family:var(--serif);font-size:15px;white-space:nowrap}
.pod span{display:block;font-size:12px;color:var(--sub);white-space:nowrap}
.pod .num{display:block;font-size:19px;margin-top:4px;color:var(--gold-d)}
.ord{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-size:16px;font-weight:700;color:var(--sub);background:#f2ebdd}

/* 狀態 */
.foot{text-align:center;color:var(--faint);font-size:13px;margin-top:22px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3f9a6b;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(63,154,107,.15)}
.dot.off{background:#c0574b;box-shadow:0 0 0 3px rgba(192,87,75,.15)}
.net{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 12px;border-radius:12px;background:#fdf1ee;border:1px solid #f1d2ca;color:#a8473b;font-size:14px}
.net span{flex:1}
.net button{min-height:40px;padding:0 14px;border-radius:10px;background:#fff;border:1px solid #e9c3b9;color:#a8473b;font-weight:600;white-space:nowrap}
.sk{border-radius:18px;background:linear-gradient(90deg,#efe8da,#f8f4ec,#efe8da);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;max-width:calc(100% - 32px);
  padding:11px 18px;border-radius:12px;background:#2b2418;color:#f6e7b8;font-size:14px;box-shadow:0 12px 26px -10px rgba(0,0,0,.5);white-space:nowrap;transition:opacity .3s}
.fade{animation:fade .45s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:359px){.kpi{font-size:42px}.c-cum{font-size:30px}.duo .v{font-size:23px}.pod b{font-size:14px}.pod .num{font-size:17px}}
.grid2>div+div{margin-top:16px}
@media (min-width:900px){.grid2>div+div{margin-top:0}.app{max-width:960px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.grid2 .pane+.pane{margin-top:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ 驚艷層：香檳絲綢底、金粉、依品階變色、立體卡 ============ */
:root{--tint:#e8cf98;--tint2:#f3dfb0}
html{background:#f1dcae}
body{background:transparent}
#termbg{position:fixed;inset:0;z-index:-2;background:var(--termfall) center top/cover no-repeat;transition:opacity .6s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(251,246,234,.18) 0%,rgba(251,246,234,.42) 38%,rgba(248,240,222,.72) 100%)}
.when{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#5d4a26;letter-spacing:.06em;white-space:nowrap}
.when .term{font-family:var(--serif);font-weight:700;font-size:15px;color:#3f2c0d;padding:2px 12px;border-radius:999px;background:rgba(255,251,240,.82);border:1px solid #e3cd98}
.when .clock{font-family:var(--num);font-size:17px;font-weight:700;color:#3f2c0d}
.login .when{margin-bottom:18px}
.app .when{justify-content:flex-start;margin:-4px 2px 14px}
.login-foot{color:#6b5530}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
.pane{background:linear-gradient(180deg,#fffdf7,#fff8ea);border-color:#e3cd98;box-shadow:0 1px 0 #fff inset,0 22px 40px -24px rgba(120,80,15,.55)}
.pane::before{border-color:rgba(176,141,71,.45)}
.pane-h h2,.kpi-lab{color:#6b4c14}
.login .pane{box-shadow:0 1px 0 #fff inset,0 30px 60px -28px rgba(120,80,15,.7)}
.login-head .org{color:#7d6232}
.login-head h1{font-size:40px;filter:drop-shadow(0 2px 0 rgba(255,255,255,.8)) drop-shadow(0 8px 18px rgba(150,105,30,.35))}
.crest{filter:drop-shadow(0 8px 16px rgba(140,95,20,.35))}
.login-head .crest{width:64px;height:64px;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.login-foot{color:#8c7448}
.seg{background:rgba(255,250,236,.55);border:1px solid #e3cd98}
.ghost{background:rgba(255,252,242,.75);border-color:#e3cd98;color:#6b4c14}
.mb{border-color:#e3cd98}
.mtext small,.pane-h small,.foot{color:#9a8156}
/* 立體會員卡 */
.cardwrap{perspective:900px}
.card{transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.card .holo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:soft-light;opacity:.75;
  background:radial-gradient(60% 70% at var(--hx,30%) var(--hy,20%),rgba(255,255,255,.75),transparent 60%),
  linear-gradient(115deg,transparent 20%,rgba(255,220,240,.35) 35%,rgba(200,240,255,.35) 50%,rgba(255,245,200,.35) 65%,transparent 80%);
  background-size:100% 100%,220% 220%;background-position:0 0,var(--hp,50%) 50%}
/* 開卡儀式 */
.rite{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,rgba(255,246,214,.98),rgba(244,222,166,.97) 60%,rgba(232,200,130,.97));animation:riteOut .5s 1.25s ease-in forwards}
.rite .crest{width:96px;height:96px;animation:riteCrest 1.2s cubic-bezier(.2,.8,.2,1) both}
.rite .ring{position:absolute;left:50%;top:45%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid #c9a352;animation:ring 1.2s .25s ease-out both}
.rite .ring.b{animation-delay:.45s}
.rite p{position:absolute;top:calc(45% + 70px);left:0;right:0;text-align:center;font-family:var(--serif);font-size:18px;letter-spacing:.4em;color:#7a5b22;animation:fade .6s .35s both}
@keyframes riteCrest{from{transform:scale(.4) rotate(-90deg);opacity:0}60%{transform:scale(1.12) rotate(8deg);opacity:1}to{transform:scale(1) rotate(0)}}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(4.2);opacity:0}}
@keyframes riteOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#dust{display:none}}

/* ============ 反差色層：朱紅、靛青、寶石色 ============ */
:root{--vermil:#b8291f;--vermil-d:#7e140e;--indigo:#16314f;--indigo-d:#0a1a2c}
/* 朱紅漆按鈕 */
.btn-gold{color:#f8e2a2;background:linear-gradient(180deg,#d0432f 0%,#a8241a 55%,#821710 100%);border:1px solid #6b120c;
  box-shadow:0 0 0 1px rgba(246,220,152,.55) inset,0 0 0 3px rgba(130,23,16,.0),0 14px 26px -12px rgba(130,23,16,.75);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn-gold::before{content:"";position:absolute;inset:4px;border:1px solid rgba(246,220,152,.55);border-radius:10px;pointer-events:none}
.spin{border-color:rgba(248,226,162,.3);border-top-color:#f8e2a2}

<script>
/* ====== 設定：正式使用時填入 Apps Script 網址；空白 = 示範資料 ====== */
const API_URL='https://script.google.com/macros/s/AKfycbwSM81dVKy_ZkFdQneulQKv7m13rfYe8xonhBFPI6T1sASw3A2Q3rBNjJ1oY3MsOPIYZw/exec';

const RANKS=[
 {k:'銀階',th:0,main:'#8b97a6',dark:'#465260',glow:'#e2e9f1',sym:'star',tag:'啟明',motto:'初心點燈，照亮第一位有緣人'},
 {k:'黃金',th:630000,main:'#c2952f',dark:'#6f500f',glow:'#fae3a3',sym:'sun',tag:'耀光',motto:'光耀有緣，福氣越做越旺'},
 {k:'鑽石',th:1260000,main:'#3474b5',dark:'#14365e',glow:'#c6e0fa',sym:'diamond',tag:'恆輝',motto:'恆心如鑽，一步一腳印'},
 {k:'晶鑽',th:1890000,main:'#7d4fbb',dark:'#3d1f6b',glow:'#e3cff8',sym:'crystal',tag:'凝華',motto:'凝聚所學，化為眾人的光'},
 {k:'翡翠',th:2520000,main:'#1f8d6c',dark:'#0b4636',glow:'#b4ecd6',sym:'jade',tag:'蘊德',motto:'溫潤載德，帶領一方弟子'},
 {k:'總裁',th:3150000,main:'#a82539',dark:'#520a17',glow:'#f7c6cf',sym:'crown',tag:'傳燈',motto:'傳燈至高，成就一脈傳承'},
 {k:'超級總裁',th:4410000,need:1,main:'#73319a',dark:'#33104a',glow:'#e6c8f5',sym:'crown',tag:'領航',motto:'帶出一位總裁，開啟領導之路'},
 {k:'環球總裁',th:5670000,need:2,main:'#1a3778',dark:'#070f2a',glow:'#f3d47e',sym:'globe',tag:'環宇',motto:'一脈傳燈，光照四方'},
 {k:'皇冠總裁',th:6930000,need:3,main:'#3a342b',dark:'#060606',glow:'#ebcb72',sym:'crown',tag:'冠冕',motto:'以德服眾，冠冕加身'},
 {k:'至尊總裁',th:8190000,need:4,main:'#b08a24',dark:'#57400a',glow:'#fae49e',sym:'crown',tag:'至尊',motto:'至高傳承，萬燈同輝'}
];
const GEMS=['#a8473b','#2a63b0','#16876a','#7a43b8','#c4801c'];
const SYM={
 star:'<path d="M32 6l7 18 19 1-15 12 5 19-16-11-16 11 5-19L6 25l19-1z"/>',
 sun:'<circle cx="32" cy="32" r="11"/><path d="M32 6v9M32 49v9M6 32h9M49 32h9M13.6 13.6l6.4 6.4M44 44l6.4 6.4M13.6 50.4L20 44M44 20l6.4-6.4"/>',
 diamond:'<path d="M32 8l22 18-22 30L10 26z"/><path d="M10 26h44M22 26l10-18 10 18-10 30zM22 26l10 30"/>',
 crystal:'<path d="M32 6l22 12v26L32 58 10 44V18z"/><path d="M10 18l22 12 22-12M32 30v28"/>',
 jade:'<circle cx="32" cy="32" r="23"/><circle cx="32" cy="32" r="8"/><circle cx="32" cy="32" r="15" stroke-dasharray="2 4"/>',
 crown:'<path d="M10 46l4-26 12 12 6-18 6 18 12-12 4 26z"/><path d="M10 53h44"/>',
 globe:'<circle cx="32" cy="32" r="24"/><ellipse cx="32" cy="32" rx="10" ry="24"/><path d="M8 32h48M12 20h40M12 44h40"/>'
};
const IC={
 user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
 lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
 eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 eyeoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A9.8 9.8 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4.1M6.1 6.1C3.4 8 2 12 2 12s3.5 7 10 7c1.8 0 3.3-.5 4.6-1.2M9.9 9.9a3 3 0 004.2 4.2"/></svg>',
 alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',
 left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};
function crest(){return `<svg class="crest" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e2a8"/><stop offset=".5" stop-color="#bf9546"/><stop offset="1" stop-color="#7d5f26"/></linearGradient></defs>
<circle cx="60" cy="60" r="56" fill="#fffdf6" stroke="url(#cg)" stroke-width="2"/><circle cx="60" cy="60" r="49" fill="none" stroke="url(#cg)" stroke-width="1" stroke-dasharray="1.6 3.4"/>
<path d="M60 18 L67 53 L102 60 L67 67 L60 102 L53 67 L18 60 L53 53 Z" fill="url(#cg)" fill-opacity=".9"/><path d="M36 36 L50 50 M84 36 L70 50 M36 84 L50 70 M84 84 L70 70" stroke="url(#cg)" stroke-width="2" stroke-linecap="round"/>
<circle cx="60" cy="60" r="7" fill="#fffdf6" stroke="url(#cg)" stroke-width="2"/></svg>`;}
function guilloche(){let s='<svg class="g" viewBox="0 0 300 300" fill="none" stroke="currentColor" stroke-width=".8" style="color:var(--glow)">';for(let i=1;i<=14;i++)s+=`<circle cx="150" cy="150" r="${i*10}"/>`;return s+'</svg>';}

/* ====== 小工具 ====== */
const $=s=>document.querySelector(s);
const fmt=new Intl.NumberFormat('en-US');
const money=n=>fmt.format(Math.round(+n||0));
const wan=n=>{n=+n||0;return n>=10000?(n/10000).toFixed(n>=1e6?0:1).replace(/\.0$/,'')+' 萬':money(n);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowMonth=()=>{const d=new Date();return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0');};
const shift=(m,k)=>{const[a,b]=m.split('.').map(Number);const d=new Date(a,b-1+k,1);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0');};
const bonus=t=>t>=400000?10:t>=300000?8:t>=200000?5:t>=100000?2:0;
function rankOf(name,cum){let i=RANKS.findIndex(r=>r.k===name);if(i<0){i=0;RANKS.forEach((r,k)=>{if(!r.need&&(+cum||0)>=r.th)i=k;});}return i;}
function theme(el,i){const r=RANKS[i];el.style.setProperty('--main',r.main);el.style.setProperty('--dark',r.dark);el.style.setProperty('--glow',r.glow);}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300);},2600);}

/* ====== 狀態 ====== */
const S={cust:{},token:'',name:'',role:'',tab:(['month','cust','rank','fill','info'].indexOf(location.hash.slice(1))>=0?location.hash.slice(1):'month'),month:nowMonth(),me:null,all:null,busy:false,net:false,timer:null,req:0,cfg:null,pend:null};
try{const o=JSON.parse(sessionStorage.getItem('perf3')||'null');if(o&&o.token){S.token=o.token;S.name=o.name;S.role=o.role;S.mode=o.mode||'';}}catch(e){}

/* ====== 後端 ====== */
async function api(body){
  if(!API_URL)return demo(body);
  const q=new URLSearchParams();
  if(body.action==='perfLogout')return {ok:true};
  if(body.action==='perfLogin'){q.set('action','perfLogin');q.set('name',body.name);q.set('pw',body.pw);}
  else{q.set('action',body.action);q.set('token',body.token||'');if(body.month)q.set('month',body.month);if(body.alias!==undefined)q.set('alias',body.alias);if(body.old!==undefined)q.set('old',body.old);if(body.npw!==undefined)q.set('pw',body.npw);}
  const r=await fetch(API_URL+'?'+q.toString(),{method:'GET'});const d=await r.json();
  if(body.action==='perfLogin'){
    if(!d||d.ok===false)return {ok:false,err:(d&&d.error)||'帳號或密碼不對'};
    if(!d.pass)return {ok:false,err:'帳號或密碼不對'};
    return {ok:true,token:d.token,name:d.name||body.name,role:d.admin?'管理':'老師'};
  }
  if(d&&d.needLogin)return {ok:false,relogin:true};
  return d;
}
/* ====== 登入頁 ====== */
function renderLogin(msg){
  $('#root').innerHTML=`
  <main class="login fade">
    ${whenHTML()}
    <div class="login-head">
      <div class="org">靈應壇 × 神奇身心靈學苑</div>
      <h1 class="foil">業績總覽</h1>
      <div class="rule"><i></i></div>
    </div>
    <form class="pane" id="lf" autocomplete="off" novalidate>
      <div class="field">
        <label for="acc">帳號</label>
        <div class="inbox">${IC.user}<input id="acc" type="text" placeholder="姓名或自訂帳號" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></div>
      </div>
      <div class="field">
        <label for="pw">密碼</label>
        <div class="inbox">${IC.lock}<input id="pw" type="text" placeholder="請輸入密碼" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
          <button type="button" class="eye" id="eye" aria-label="顯示密碼">${IC.eye}</button></div>
      </div>
      <div class="err" id="err" role="alert">${IC.alert}<span></span></div>
      <button class="btn-gold" id="go" type="submit"><span>登入</span></button>
    </form>
    <p class="login-foot">僅限學苑授權會員使用</p>
  </main>`;
  if(msg)showErr(msg);
  $('#acc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#pw').focus();}});
  $('#eye').onclick=()=>{const p=$('#pw'),on=p.style.webkitTextSecurity==='none';p.style.webkitTextSecurity=on?'disc':'none';$('#eye').innerHTML=on?IC.eye:IC.eyeoff;};
  $('#lf').onsubmit=doLogin;
}
function showErr(m){const e=$('#err');if(!e)return;e.classList.toggle('on',!!m);e.querySelector('span').textContent=m||'';}
async function doLogin(ev){
  ev.preventDefault();if(S.busy)return;
  const acc=$('#acc').value.trim(),pw=$('#pw').value;
  if(!acc){showErr('請輸入帳號');$('#acc').focus();return;}
  if(!pw){showErr('請輸入密碼');$('#pw').focus();return;}
  showErr('');S.busy=true;const b=$('#go');b.disabled=true;b.innerHTML='<i class="spin"></i><span>驗證中</span>';
  try{
    const r=await api({action:'perfLogin',name:acc,pw});
    if(!r||!r.ok){
      if(r&&r.err&&/太多次/.test(r.err)){showErr(r.err);return;}
      const q=await pvTryLogin(acc,pw);
      if(q.ok){S.mode='pv';S.token=q.token;S.pv=q.pv;S.name=q.pv.name;checkUpPV(q.pv.name,q.pv.role);try{sessionStorage.setItem('perf3',JSON.stringify({mode:'pv',token:q.token,name:S.name}));}catch(e){}S.busy=false;renderPV();loadPV();return;}
      showErr(q.err||(q.locked?`錯誤次數太多，請 ${q.wait||10} 分鐘後再試`:(r&&r.err)||'帳號或密碼不對'));return;}
    S.token=r.token;S.name=r.name||acc;S.role=r.role==='管理'?'管理':'老師';checkUpTeacher(S.name);S.tab='month';S.month=nowMonth();S.me=null;S.all=null;S.cust={};
    try{sessionStorage.setItem('perf3',JSON.stringify({token:S.token,name:S.name,role:S.role}));}catch(e){}
    if(VIEW==='dash'){location.replace(location.pathname);return;}
    S.busy=false;firstPaint=true;load(true);startTimer();
  }catch(e){showErr('網路不通，請稍後再試');}
  finally{S.busy=false;if(b.isConnected){b.disabled=false;b.innerHTML='<span>登入</span>';}}
}

/* ====== 登入後 ====== */
const CORE=['陳捷容','羅文勳','蕭竣方','陳彩綺'];
const STEPS=[{t:100000,p:2},{t:200000,p:5},{t:300000,p:8},{t:400000,p:10}];
const TEAMP=[0,2,3,4,5]; /* 推薦人團隊業績抽成：依自己當月 PV 級距 */
const RANKP=[60,68,75,82,90,97,105,112,120,127]; /* 聘階 %（依正式老師獎金規則；總裁以上為暫定） */
function tabsHTML(){const admin=S.role==='管理';const T=[['month','業績'],['cust','客戶'],['rank','團隊'],['fill','填單'],['info','資料']];if((S.me&&S.me.dash)||VIEW==='dash')T.push(['dash','儀表台']);else if(admin)T.push(['all','全公司']);
  return `<div class="seg" style="grid-template-columns:repeat(${T.length},1fr)">${T.map(([k,n])=>`<button data-t="${k}" class="${(VIEW==='dash'?k==='dash':S.tab===k)?'on':''}">${n}</button>`).join('')}</div>`;}
function greetHTML(){const d=S.me,ri=d?rankOf(d.rank,d.cum):-1,r=ri>=0?RANKS[ri]:null;
  const c=r?r.dark:'#3f2c0d';return `<span class="greet" style="--gc:${c}"><em class="gname">${esc(S.name)}</em>${r?`<em class="gname">${r.k}</em>`:''}<span class="ghi">您好</span></span>`;}
function shell(inner){
  const admin=S.role==='管理';
  return `<div class="app fade">
    <header class="top">
      <div class="who">${crest()}<div><b>業績總覽</b>${greetHTML()}</div></div>
      <div class="hdate">${hdateHTML()}</div>
      <button class="ghost" id="out">登出</button>

/* 客戶：已報／未報／建議聯繫 */
function custAdvice(list,month){
  const prev=shift(month,-1),mm=+month.split('.')[1],idle=shift(month,-3);
  const done=[],todo=[];
  list.forEach(c=>{const ms=c.months||[];(ms.includes(month)?done:todo).push(c);});
  const tagged=todo.map(c=>{const ms=c.months||[],last=c.last||ms.slice().sort().pop()||'';let why=[],score=0;
    if(ms.includes(prev)){why.push('上個月有報');score+=50;}
    if(+c.bm===mm){why.push('本月生日');score+=40;}
    if(c.vip){why.push('常客');score+=30;}
    if((+c.times||ms.length)>=3){score+=10;}
    if(last&&last<=idle){why.push('很久沒來');score+=15;}
    return {...c,last,why,score};}).sort((a,b)=>b.score-a.score);
  return {done,todo:tagged,suggest:tagged.filter(c=>c.why.length).slice(0,6)};
}

function eveAfter(ym){const [y,m]=ym.split('.').map(Number);for(let Y=y;Y<=y+1;Y++){const t=CNY[Y];if(!t)continue;const ny=new Date(Y+'-'+t+'T00:00:00');const eve=new Date(ny-864e5);

  if(d.type==='年斗'){const e=eveAfter(d.month);return {...d,dueMonth:e?e.getFullYear()+'.'+String(e.getMonth()+1).padStart(2,'0'):'',dueText:e?`${e.getFullYear()}/${e.getMonth()+1}/${e.getDate()}（除夕）`:'—'};}
  const st=d.after?shift(d.month,1):d.month,last=shift(st,2);return {...d,dueMonth:last,dueText:`${last} 法會後`,from:st};

  const now=new Date(),ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),t0=new Date();t0.setHours(0,0,0,0);
  const ev=(S.cfg.events||[]).filter(e=>e.to&&e.to.teacher!==false);
  const md=d=>{const [,m,dd]=d.split('-').map(Number);const w='日一二三四五六'[new Date(d+'T00:00:00').getDay()];return `${m}/${dd}（${w}）`;};
  let rit=ev.filter(e=>e.type==='ritual'&&(e.date||'').slice(0,7)===ym);
  const up=ev.filter(e=>e.type==='ritual'&&new Date((e.end||e.date)+'T23:59:59')>=t0).sort((a,b)=>a.date<b.date?-1:1);
  if(up[0]&&!rit.includes(up[0]))rit=rit.concat(up[0]);
  const ritH=rit.length?rit.map(e=>{const past=new Date((e.end||e.date)+'T23:59:59')<t0;

    ${e.place?`<div class="ann-l muted">${esc(e.place)}</div>`:''}
    ${e.note?`<div class="ann-l note">${esc(e.note)}</div>`:''}</div>`;}).join(''):'<div class="empty">這個月的法會日期還沒公布</div>';

  <button class="go-fill" data-fill="1">點我前往填單系統${IC.right}</button>`;}

    const note=left>0?`距<b> ${nx.k} </b>還差 NT$ ${money(left)}`:(nx.need?`業績已達標，需團隊 ${nx.need} 位總裁`:'業績已達標，待升階確認');

function render(){
  if(!S.token){renderLogin();return;}
  if(S.mode==='pv'){renderPV();return;}
  if(VIEW==='dash'){renderDash();return;}
  const d=S.tab==='all'?S.all:S.me;
  let inner=S.tab==='cust'?custView():S.tab==='info'?infoView():S.tab==='fill'?fillView():d?(S.tab==='all'?allView(d):S.tab==='rank'?rankView(d):monthView(d)):(S.net?`<section class="pane"><div class="empty"><b>目前無法取得業績</b>請檢查網路後按「重試」。</div></section>`:skeleton());
  $('#root').innerHTML=shell(inner);
  const card=document.querySelector('.card');if(card){theme(card,+card.dataset.rank);tilt();}
  if(S.me)setTint(rankOf(S.me.rank,S.me.cum));

  $('#out').onclick=logout;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(b.dataset.t==='dash'){location.href=location.pathname+'?view=dash';return;}if(S.tab===b.dataset.t)return;S.tab=b.dataset.t;firstPaint=true;load(true);scrollTo({top:0});});
  const pm=$('#pm'),nm=$('#nm');
  if(pm)pm.onclick=()=>{S.month=shift(S.month,-1);S.me=null;S.all=null;load(true);};
  if(nm)nm.onclick=()=>{if(S.month>=nowMonth())return;S.month=shift(S.month,1);S.me=null;S.all=null;load(true);};
  const rt=$('#retry');if(rt)rt.onclick=()=>load(false);
  document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{S.ctab=b.dataset.ct;render();});
  document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=goFill);
  const tb=$('#todoBox');if(tb)tb.ontoggle=()=>{S.todoOpen=tb.open;};
  const sa=$('#saveAlias');if(sa)sa.onclick=saveAlias;
  const sp=$('#savePw');if(sp)sp.onclick=savePw;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.tab='cust';S.ctab=b.dataset.go;firstPaint=true;render();load(false);scrollTo({top:0});});

}
/* 上次的資料先存在手機裡，打開馬上顯示，再背景更新 */
function lcKey(){return 'perfc_'+S.name;}
function lcGet(k){try{const o=JSON.parse(localStorage.getItem(lcKey())||'{}');return o[k];}catch(e){return null;}}
function lcPut(k,v){try{const o=JSON.parse(localStorage.getItem(lcKey())||'{}');o[k]=v;localStorage.setItem(lcKey(),JSON.stringify(o));}catch(e){}}
function lcClear(){try{Object.keys(localStorage).filter(k=>k.indexOf('perfc_')===0).forEach(k=>localStorage.removeItem(k));}catch(e){}}
async function load(clear){
  if(!S.token)return;if(S.mode==='pv'){return loadPV();}if(VIEW==='dash'){return loadDash(clear);}const id=++S.req;
  const tab=S.tab,month=S.month;
  if(clear){S.net=false;
    if(tab==='all'){if(!S.all)S.all=lcGet('all_'+month)||null;}else if(!S.me){S.me=lcGet('me_'+month)||null;}
    if(!(S.cust&&S.cust[month])){const c=lcGet('cu_'+month);if(c){S.cust=S.cust||{};S.cust[month]=c;}}
    render();}
  loadCfg();loadPend();
  const wantCust=tab==='cust'||(tab==='month'&&month>=nowMonth());
  const pc=wantCust?api({action:'perfCustomers',token:S.token,month}).catch(()=>null):null;
  try{
    const r=await api({action:tab==='all'?'perfAll':'perfMe',token:S.token,month});
    if(id!==S.req)return;
    if(r&&r.relogin){expire();return;}
    if(!r||!r.ok)throw new Error(r&&r.err||'bad');
    if(tab==='all'){S.all=r;lcPut('all_'+month,r);}else{S.me=r;if(r.name)S.name=r.name;lcPut('me_'+month,r);}
    S.net=false;render();
  }catch(e){if(id!==S.req)return;S.net=true;render();}
  if(pc){const c=await pc;if(id!==S.req)return;if(c&&c.ok){S.cust=S.cust||{};S.cust[month]=c.customers||[];lcPut('cu_'+month,S.cust[month]);render();}}
}
function startTimer(){clearInterval(S.timer);S.timer=setInterval(()=>{if(S.token&&!document.hidden&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))load(false);},60000);}
function clearSess(){setTint(1);firstPaint=true;clearInterval(S.timer);S.token='';S.me=null;S.all=null;S.cust={};S.tab='month';try{sessionStorage.removeItem('perf3');}catch(e){}}
function expire(){clearSess();renderLogin('登入已逾時，請重新登入');}
async function logout(){const t=S.token;lcClear();clearSess();renderLogin();toast('已登出');try{await api({action:'perfLogout',token:t});}catch(e){}}

/* ====== 手機鍵盤：把正在填的欄位（連同標題）捲到可見區中央 ====== */
function centerField(el){
  const box=el.closest('.field')||el,vv=window.visualViewport,h=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0;
  const r=box.getBoundingClientRect(),d=(r.top+r.height/2)-(top+h/2);
  if(Math.abs(d)>8)window.scrollBy({top:d,behavior:'smooth'});
}
document.addEventListener('focusin',e=>{if(e.target.matches('input'))setTimeout(()=>centerField(e.target),300);});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const a=document.activeElement;if(a&&a.matches('input'))centerField(a);});

function dAmt(n,m){const names=Object.keys(DCUM),i=names.indexOf(n),k=m===nowMonth()?1:(m<nowMonth()?.85:0);return Math.round((420000-i*19000)*k/100)*100;}
function dRank(n){return RANKS[rankOf('',DCUM[n])].k;}
async function demo(b){

  if(b.action==='perfSetPw'){return b.old==='0000'?{ok:false,error:'目前的密碼不對'}:{ok:true};}
  if(b.action==='perfSetAlias'){return {ok:true,alias:(b.alias||'').toLowerCase()};}
  if(b.action==='perfLogin'){if(!DCUM[b.name])return{ok:false,err:'帳號或密碼不對'};const t='d'+Date.now();DSESS[t]={name:b.name,role:b.name==='蕭竣方'?'管理':'老師'};return{ok:true,token:t,name:b.name,role:DSESS[t].role};}
  if(b.action==='perfLogout'){delete DSESS[b.token];return{ok:true};}
  const s=DSESS[b.token];if(!s)return{ok:false,relogin:true};
  if(b.action==='perfDash'){if(s.role!=='管理')return{ok:false,error:'沒有權限'};const pm=shift(b.month,-1);
    const rows=Object.keys(DCUM).map((n,i)=>{const a=(i%6===5)?0:dAmt(n,b.month);const w=[.3,.25,.2,.15,.1],ks=['補財','還陰債','年斗','祭改','普桌'],pr=[3000,6000,10000,3000,2000];
      return {name:n,cum:DCUM[n],sp:DSP[n]||'',goal:300000,amount:a,prev:Math.round(dAmt(n,pm)*(1+((i*7)%5-2)/10)),items:a?ks.map((k,j)=>({k,n:Math.max(1,Math.round(a*w[j]/pr[j])),a:Math.round(a*w[j])})):[]};});
    const trend=[];for(let i=5;i>=0;i--){const m=shift(b.month,-i);trend.push({m,total:Object.keys(DCUM).reduce((t,n)=>t+dAmt(n,m)*(1-i*.04),0)});}
    return {ok:true,month:b.month,rows,trend,serverTime:now};}
  if(b.action==='perfMe'){const a=dAmt(s.name,b.month);const w=[.3,.25,.2,.15,.1],ks=['補財','還陰債','年斗','祭改','普桌'],pr=[3000,6000,10000,3000,2000];
    const items=a?ks.map((k,i)=>({k,n:Math.max(1,Math.round(a*w[i]/pr[i])),a:Math.round(a*w[i])})):[];
    const down=[];(function walk(n){Object.keys(DSP).forEach(c=>{if(DSP[c]===n&&!down.find(x=>x.name===c)){down.push({name:c,rank:dRank(c),amount:dAmt(c,b.month)});walk(c);}});})(s.name);
    return{ok:true,dash:s.role==='管理',name:s.name,role:s.role,rank:dRank(s.name),cum:DCUM[s.name],asof:'2026.09',mine:{amount:a,priced:true,items},down,team:a+down.reduce((x,y)=>x+y.amount,0),serverTime:now};}

  if(b.action==='perfCustomers'){const seed=[...s.name].reduce((a,c)=>a+c.charCodeAt(0),0);let x=seed;const rnd=()=>{x=(x*9301+49297)%233280;return x/233280;};
    const F='王李張劉陳楊黃趙吳周徐孫馬朱胡郭何林羅高',G='淑芬美玲雅婷怡君志明俊傑家豪佳慧秀英建宏文雄麗華惠珍宗翰冠廷';
    const list=[],seen={};for(let i=0;i<60;i++){let nm=F[Math.floor(rnd()*F.length)]+G[Math.floor(rnd()*G.length)]+G[Math.floor(rnd()*G.length)];if(seen[nm]){i--;continue;}seen[nm]=1;
      const ms=[];for(let k=0;k<8;k++)if(rnd()<.42)ms.push(shift(b.month,-k));
      if(!ms.length)ms.push(shift(b.month,-(3+Math.floor(rnd()*5))));
      const dou=[];if(rnd()<.45)dou.push({type:'年斗',month:shift(b.month,-Math.floor(rnd()*14))});if(rnd()<.35)dou.push({type:'季斗',month:shift(b.month,-Math.floor(rnd()*5)),after:rnd()<.3});

    return{ok:true,customers:list};}
  if(b.action==='perfAll'){if(s.role!=='管理')return{ok:false,err:'沒有權限'};const rows=Object.keys(DCUM).map(n=>({name:n,rank:dRank(n),cum:DCUM[n],amount:dAmt(n,b.month)}));return{ok:true,rows,total:rows.reduce((x,y)=>x+y.amount,0),serverTime:now};}
  return{ok:false,err:'未知動作'};
}

    ${teams.map(t=>`<div class="tm2"><div class="t"><b>${esc(t.r.name)} 團隊</b><span class="num">${money(t.sum)}</span></div><div class="pills">${[t.r].concat(t.m).map(x=>`<span class="cpill">${esc(x.name)} ${wan(x.amount)}</span>`).join('')}</div></div>`).join('')||'<div class="empty">還沒有團隊資料</div>'}</details>

    ${courses.map(e=>`<div class="ord-r"><b>${+e.date.split('-')[1]}/${+e.date.split('-')[2]}</b><span>${esc(e.title||'課程')}${e.time?'・'+esc(e.time):''}${e.note?'<br><small class="muted">'+esc(e.note)+'</small>':''}</span></div>`).join('')||'<div class="empty">這個月行事曆沒有課程</div>'}
    <p class="muted" style="margin:8px 0 0">報名人數等學員系統接上後會顯示在這裡</p></details>`;}
function dashShell(inner){return `<div class="app fade">
  <header class="top"><div class="who">${crest()}<div><b>${S.dashOk?'老師儀表台':'業績總覽'}</b><span class="greet"><em class="gname" style="--gc:#3f2c0d">${esc(S.name)}</em><span class="ghi">您好</span></span></div></div>
  <div class="hdate">${hdateHTML()}</div><button class="ghost" id="out">登出</button></header>
  ${S.dashOk?tabsHTML():''}
  ${S.net?`<div class="net">${IC.alert}<span>網路不通，資料可能不是最新的</span><button id="retry">重試</button></div>`:''}
  ${inner}</div>`;}
function renderDash(){
  if(S.dashDeny){location.replace(location.pathname);return;}
  const inner=dashView();
  $('#root').innerHTML=dashShell(inner);
  $('#out').onclick=logout;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(b.dataset.t==='dash')return;location.href=location.pathname+'#'+b.dataset.t;});
  const pm=$('#pm'),nm=$('#nm');
  if(pm)pm.onclick=()=>{S.month=shift(S.month,-1);load(true);};
  if(nm)nm.onclick=()=>{if(S.month>=nowMonth())return;S.month=shift(S.month,1);load(true);};
  const rt=$('#retry');if(rt)rt.onclick=()=>load(false);
  const da=$('#dAll');if(da)da.onclick=()=>{S.dAll=!S.dAll;renderDash();};
  document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=e=>{e.preventDefault();copyTxt(b.dataset.cp);});
}
async function loadDash(clear){
  const id=++S.req,month=S.month;S.dash=S.dash||{};
  if(clear){S.net=false;if(!S.dash[month])S.dash[month]=lcGet('dash_'+month)||null;if(S.dash[month])S.dashOk=true;renderDash();}
  loadCfg();
  if(!S.dpend){const go=()=>window.MiiragicPending&&MiiragicPending.byReferrer().then(r=>{S.dpend=r||{};renderDash();}).catch(()=>{});
    if(window.MiiragicPending)go();else{const sc=document.createElement('script');sc.src='https://kevin87265-pixel.github.io/portal/pending.js';sc.onload=go;document.head.appendChild(sc);}}
  try{const r=await api({action:'perfDash',token:S.token,month});
    if(id!==S.req)return;if(r&&r.relogin){expire();return;}
    if(r&&r.ok===false&&/權限/.test(r.error||'')){S.dashDeny=true;renderDash();return;}
    if(!r||!r.ok)throw 0;S.dashDeny=false;S.dashOk=true;S.dash[month]=r;lcPut('dash_'+month,r);S.net=false;renderDash();
  }catch(e){if(id!==S.req)return;S.net=true;renderDash();}
}

/* ====================== 考核／實習老師（積點系統帳號）晉升進度 ====================== */
const PV_STAGE={1:{name:'考核老師',price:1680,goal:168000,next:'實習老師'},2:{name:'實習老師',price:1470,goal:147000,next:'正式老師'}};
async function mgRpc(fn,body){
  if(!API_URL)return pvDemo(fn,body);
  try{const r=await fetch(SUPA+'/rest/v1/rpc/'+fn,{method:'POST',cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const t=await r.text();let j=null;try{j=t?JSON.parse(t):null;}catch(e){}if(!r.ok)return {ok:false,error:{message:(j&&(j.message||j.error))||'HTTP'}};return j||{ok:false};}
  catch(e){return {ok:false,error:{message:'NETWORK'}};}}
function pvDemo(fn,b){const today=new Date(),ym=(k)=>{const d=new Date(today.getFullYear(),today.getMonth()-k,5);return d.toISOString().slice(0,10);};
  if(fn==='mg_login'&&b.p_user!=='示範考核')return {ok:false};
  const recs=[];[[0,12],[0,6],[1,15],[2,14],[3,11]].forEach(([k,q],i)=>recs.push({id:'p'+i,sid:'s1',item:'法會金紙',cost:1680,qty:q,pv:1680*q,status:'approved',date:ym(k)}));
  recs.push({id:'px',sid:'s1',item:'還陰債',cost:2880,qty:3,pv:8640,status:'pending',date:ym(0)});
  return {ok:true,token:'demo',account:{type:'student',linked_id:'s1',username:'示範考核'},data:{students:[{id:'s1',name:'林示範',role:1}],pv_records:recs}};}
function pvSid(acc){return acc?(acc.type==='both'?acc.linked_student_id:(acc.type==='student'?acc.linked_id:null)):null;}
function pvApply(r){const acc=r.account||{},d=r.data||{},sid=pvSid(acc),st=(d.students||[]).find(x=>x.id===sid);
  if(!st)return {err:'找不到你的學員資料，請找推薦人確認'};
  const role=+st.role;if(!PV_STAGE[role])return {err:role>=3?'正式老師請用填單系統的帳號密碼登入':'學員請用學員系統登入',role};
  return {ok:true,name:st.name,role,recs:(d.pv_records||[]).filter(x=>x.sid===sid)};}
async function pvTryLogin(acc,pw){const r=await mgRpc('mg_login',{p_user:acc,p_pass:pw});
  if(!r||!r.ok)return {ok:false,locked:r&&r.locked,wait:r&&r.wait_min};
  const a=pvApply(r);if(!a.ok)return {ok:false,err:a.err};
  try{localStorage.setItem('miiragic_token',r.token);}catch(e){}
  return {ok:true,token:r.token,pv:a};}
async function loadPV(){
  const tok=(()=>{try{return localStorage.getItem('miiragic_token')||'';}catch(e){return '';}})()||S.token;
  const r=await mgRpc('mg_load',{p_token:tok});
  if(!r||!r.ok){if(r&&r.error&&/AUTH|token|登入/i.test(r.error.message||'')){expire();return;}S.net=true;renderPV();return;}
  const a=pvApply(r);if(a.ok){S.pv=a;S.name=a.name;S.net=false;const pr=stageGet(a.name);if(pr!==null&&+pr<a.role){stageSet(a.name,a.role);setTimeout(()=>showUp(a.role),400);}}renderPV();}
const ymOf=d=>{const m=String(d||'').replace(/\//g,'-').match(/^(\d{4})-(\d{1,2})/);return m?m[1]+'.'+m[2].padStart(2,'0'):'';};
function pvView(){
  const p=S.pv;if(!p)return `<div class="sk" style="height:260px"></div><div class="sk gap" style="height:200px"></div>`;
  const stg=PV_STAGE[p.role],ok=p.recs.filter(x=>x.status==='approved'),pend=p.recs.filter(x=>x.status==='pending');
  const cum=ok.reduce((s,x)=>s+(+x.pv||0),0),gap=Math.max(0,stg.goal-cum),M=nowMonth();
  const mon=k=>ok.filter(x=>ymOf(x.date)===shift(M,-k)).reduce((s,x)=>s+(+x.pv||0),0);
  const thisM=mon(0);
  /* 速度＝這一階開始有業績的那個月到本月，平均每月多少（含本月） */
  const firstM=ok.map(x=>ymOf(x.date)).filter(Boolean).sort()[0]||M;
  const nMon=Math.max(1,(+M.slice(0,4)-+firstM.slice(0,4))*12+(+M.slice(5)-+firstM.slice(5))+1);
  const avg=Math.round(cum/nMon);
  const span=S.pvSpan||3,target=gap?Math.ceil(gap/span/100)*100:0,leftM=Math.max(0,target-thisM);
  const pendPV=pend.reduce((s,x)=>s+(+x.pv||0),0);
  const when=n=>{const d=new Date();d.setMonth(d.getMonth()+n);return `${d.getFullYear()} 年 ${d.getMonth()+1} 月`;};
  let est1='',est2='';
  if(!gap){est1=`<p>已達門檻，可以請推薦人幫你升${stg.next}</p>`;}
  else{
    est1=`<p>目標：<b>${when(span)}</b> 升${stg.next}</p><p>每月做到 <b>${money(target)} PV</b> 就能達成</p>`;
    if(p.role===1){const m2=span+Math.ceil(PV_STAGE[2].goal/target);est2=`<b>${when(m2)}</b> 升正式老師`;}
    if(avg>=target)est1+=`<p class="muted">照目前速度會更早達成！</p>`;
  }
  const det=ok.filter(x=>ymOf(x.date)===M).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `<section class="pane ink">
    <div class="kpi-lab">${stg.name}（${stg.price}）・晉升進度</div>
    <div class="kpi num"><small>PV</small><span>${money(cum)}</span></div>
    <div class="th" style="margin-top:12px"><div class="th-top"><span>升${stg.next}門檻 ${money(stg.goal)} PV</span><span class="th-now">${Math.min(100,Math.floor(cum/stg.goal*100))}%</span></div>
      <div class="th-bar" style="margin:10px 0 8px"><i style="width:${Math.min(100,cum/stg.goal*100).toFixed(1)}%"></i></div>
      <div class="th-msg">${gap?`還差 <b class="num">${money(gap)}</b> PV 升${stg.next}`:`<b>已達門檻！</b>請推薦人幫你晉升${stg.next}`}</div></div>
    ${pendPV?`<div class="th-remind" style="margin-top:10px">${IC.alert}<span>還有 <b>${money(pendPV)}</b> PV 等推薦人審核，通過就會加上去</span></div>`:''}
  </section>
  <section class="pane"><div class="pane-h"><h2>目標設定</h2><small>${+M.split('.')[1]} 月</small></div>
    <div class="span-lab">設定目標：幾個月內升級？</div><div class="span-pick">${[2,3,6,12].map(n=>`<button data-span="${n}" class="${span===n?'on':''}">${n}個月</button>`).join('')}</div>
    <div class="cstat c3" style="margin-top:12px"><div><b class="num">${wan(target)}</b><span>本月目標</span></div><div><b class="num">${wan(thisM)}</b><span>本月已審核</span></div><div><b class="num" style="${leftM?'color:#a8473b':''}">${leftM?wan(leftM):'達標'}</b><span>本月還差</span></div></div>
    <div class="est">${est1}${est2?`<p>${est2}</p>`:''}</div></section>
  <section class="pane"><div class="pane-h"><h2>本月審核通過的業績</h2><small>${det.length} 筆</small></div>
    ${det.length?det.map(x=>`<div class="ord-r"><b>${String(x.date).slice(5,10).replace('-','/')}</b><span>${esc(x.item)} × ${x.qty}</span><span class="num" style="margin-left:auto">${money(x.pv)}</span></div>`).join(''):'<div class="empty">這個月還沒有審核通過的業績</div>'}
    <a class="go-fill" href="https://kevin87265-pixel.github.io/miiragic-points/" style="text-decoration:none">去積點系統申報業績${IC.right}</a></section>`;}
function renderPV(){
  $('#root').innerHTML=`<div class="app fade"><header class="top"><div class="who">${crest()}<div><b>晉升進度</b><span class="greet"><em class="gname" style="--gc:#3f2c0d">${esc(S.name)}</em><span class="ghi">您好</span></span></div></div>
  <div class="hdate">${hdateHTML()}</div><button class="ghost" id="out">登出</button></header>
  ${S.net?`<div class="net">${IC.alert}<span>網路不通，資料可能不是最新的</span><button id="retry">重試</button></div>`:''}${pvView()}</div>`;
  $('#out').onclick=()=>{try{localStorage.removeItem('miiragic_token');}catch(e){}S.mode='';S.pv=null;logout();};
  const rt=$('#retry');if(rt)rt.onclick=loadPV;
  document.querySelectorAll('[data-span]').forEach(b=>b.onclick=()=>{S.pvSpan=+b.dataset.span;renderPV();});}

/* ====== 升級通知（升級後第一次登入跳一次） ====== */
const UP={1:{cls:'b1',tag:'考核',k:'晉 升 成 功',t:'恭喜成為考核老師',sub:'你的努力大家都看到了！<br>從這個月開始，法會金紙以 1680 計算',goal:'下一個目標・升實習老師',g:'168,000 PV',btn:'我知道了，繼續努力'},
 2:{cls:'b2',tag:'實習',k:'晉 升 成 功',t:'恭喜成為實習老師',sub:'離正式老師只剩最後一步了！<br>從這個月開始，法會金紙以 1470 計算',goal:'下一個目標・升正式老師（1260）',g:'147,000 PV',btn:'我知道了，繼續努力'},
 3:{cls:'b3',tag:'正式',k:'歡 迎 加 入',t:'恭喜成為正式老師',sub:'從今天起，你就是學苑的正式老師',btn:'開始我的正式老師之路'}};
function stageGet(n){try{return localStorage.getItem('perfStage_'+n);}catch(e){return null;}}
function stageSet(n,v){try{localStorage.setItem('perfStage_'+n,String(v));}catch(e){}}
function showUp(role){const u=UP[role];if(!u)return;
  const body=role===3?`<div class="up-goal"><small>每月門檻獎金・當月業績達標就加發</small><div class="up-tiers">${[[2,10],[5,20],[8,30],[10,40]].map(([p,w])=>`<div><b>${p}%</b><span>當月達<br>${w}萬PV</span></div>`).join('')}</div></div>
    <div class="up-lt">正式老師專屬</div><div class="up-pg"><div><b>1260</b><span>法會金紙計價</span></div><div><b>填單系統</b><span>專屬填單系統</span></div><div><b>業績總覽</b><span>業績、客戶提醒</span></div><div><b>自動升聘階</b><span>專屬標章與禮遇</span></div></div>`
    :`<div class="up-goal"><small>${u.goal}</small><b class="up-big">${u.g}</b><span>審核通過的業績都會自動累積</span></div>`;
  const d=document.createElement('div');d.className='up-mask';
  d.innerHTML=`${role===3?'<div class="up-conf">'+Array.from({length:36},(_,i)=>`<i style="left:${Math.random()*100}%;top:${Math.random()*20}%;background:${['#f3d98e','#c99b45','#e8a5a0','#9fe0b5','#c6cbee'][i%5]};transform:rotate(${Math.random()*180}deg)"></i>`).join('')+'</div>':''}
  <div class="up-md"><div class="up-badge ${u.cls}">${u.tag}</div><div class="up-k">${u.k}</div><h2>${u.t}</h2><div class="up-sub">${u.sub}</div>${body}<button class="up-btn">${u.btn}</button></div>`;
  document.body.appendChild(d);d.querySelector('.up-btn').onclick=()=>d.remove();}
function checkUpPV(name,role){const prev=stageGet(name);stageSet(name,role);if(prev===null||+prev<role)setTimeout(()=>showUp(role),400);}
function checkUpTeacher(name){const prev=stageGet(name);if(prev!==null&&+prev<3){stageSet(name,3);setTimeout(()=>showUp(3),400);}}

(function(){if(!/^https?:/.test(location.protocol))return;fetch(location.pathname.replace(/[^/]*$/,'')+'version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(v=>{v=(v||'').trim();

applyTerm();
if(S.token){load(true);startTimer();}else renderLogin();
