<style>
/* ==================================================================
   主題：深色（預設）／淺色／大字模式
   ================================================================== */
:root{
  color-scheme:light only;
  --bg:#f6f2ea;
  --bg-2:#efe9de;
  --bg-card:#ffffff;
  --bg-card-hover:#fffcf6;
  --text:#27221b;
  --text-dim:#7a705f;
  --text-faint:#a9a08f;
  --gold:#9c7630;
  --gold-soft:rgba(156,118,48,.10);
  --gold-line:rgba(156,118,48,.35);
  --green:#4f7c63;
  --green-soft:rgba(79,124,99,.10);
  --violet:#7a5a94;
  --violet-soft:rgba(122,90,148,.10);
  --line:rgba(60,45,20,.10);
  --line-strong:rgba(60,45,20,.18);
  --danger:#b24c3a;
  --shadow:0 1px 2px rgba(60,45,20,.06),0 8px 24px rgba(60,45,20,.08);
  --shadow-hover:0 2px 4px rgba(60,45,20,.08),0 16px 36px rgba(60,45,20,.14);
  --accent:var(--gold);
  --accent-soft:var(--gold-soft);
  --fs-body:15px;--fs-card-title:17px;--fs-cat:15px;--fs-h1:30px;--fs-bigmenu:32px;
  --radius:16px;
}
@media (prefers-color-scheme:dark){:root,html,body{color-scheme:light only;background:#f6f2ea;color:#27221b;}}

html[data-size="large"]{--fs-body:18px;--fs-card-title:20px;--fs-cat:18px;--fs-h1:36px;--fs-bigmenu:38px;}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--bg);}
body{
  background:var(--bg);color:var(--text);
  background-image:radial-gradient(1200px 500px at 50% -200px,var(--gold-soft),transparent 70%);
  background-repeat:no-repeat;
  font-family:'Noto Sans TC',sans-serif;font-size:var(--fs-body);min-height:100vh;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  transition:background-color .3s,color .3s;
}
.wrap{max-width:880px;margin:0 auto;padding:28px 16px 110px;}
button{font-family:inherit;color:inherit;}
svg.i{pointer-events:none;width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
:is(button,a,.card):focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

/* ---------- 頁首 ---------- */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
h1{font-family:'Noto Serif TC',serif;font-size:var(--fs-h1);font-weight:900;letter-spacing:.08em;line-height:1.25;}
h1 .sub{display:flex;align-items:center;gap:10px;font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:500;color:var(--text-dim);letter-spacing:.3em;margin-top:8px;}
h1 .sub::before{content:"";width:18px;height:1px;background:var(--gold);}
.toggles{display:flex;flex-shrink:0;background:var(--bg-card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow);}
.toggles button{
  display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:999px;background:transparent;
  color:var(--text-dim);cursor:pointer;transition:background .2s,color .2s;
}
.toggles button:hover{background:var(--bg-card-hover);color:var(--text);}
#btn-size[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold);}
#btn-size span{font-size:14px;font-weight:700;letter-spacing:-.02em;}
#btn-size sup{font-size:10px;}

/* ---------- 首頁大選單 ---------- */
.big-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;}
.big-menu button{
  --c:var(--gold);--cs:var(--gold-soft);
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:8px;
  min-height:300px;padding:26px 24px 24px;text-align:left;cursor:pointer;
  background:linear-gradient(180deg,var(--cs),transparent 55%),var(--bg-card);
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;
}
.big-menu button::before{ /* 頂部色條 */
  content:"";position:absolute;left:24px;right:24px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c);
}
.big-menu button::after{ /* 浮水印大字 */
  content:attr(data-mark);position:absolute;right:-10px;top:-18px;
  font-family:'Noto Serif TC',serif;font-weight:900;font-size:150px;line-height:1;color:var(--c);opacity:.07;pointer-events:none;
}
.big-menu button:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--c);}
.big-menu button:active{transform:translateY(-1px);}
#menu-teacher{--c:var(--green);--cs:var(--green-soft);}
#menu-student{--c:var(--violet);--cs:var(--violet-soft);}
.big-menu .zone-tag{
  position:absolute;top:22px;left:24px;display:inline-flex;align-items:center;gap:6px;
  font-size:11px;letter-spacing:.2em;color:var(--c);
}
.big-menu .zone-tag svg.i{width:13px;height:13px;}
.big-menu .zone-name{font-family:'Noto Serif TC',serif;font-weight:900;font-size:var(--fs-bigmenu);letter-spacing:.14em;color:var(--c);}
.big-menu .zone-desc{color:var(--text-dim);font-size:.9em;letter-spacing:.06em;}
.big-menu .zone-go{
  margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 16px;border-radius:999px;
  border:1px solid var(--line-strong);font-size:13px;letter-spacing:.12em;color:var(--text);transition:background .25s,border-color .25s,gap .25s;
}
.big-menu button:hover .zone-go{background:var(--c);border-color:var(--c);color:#fff;gap:12px;}

/* ---------- 分區內頁 ---------- */
.zone{display:none;animation:rise .35s cubic-bezier(.2,.8,.2,1);}
.zone.active{display:block;}
#zone-admin{--accent:var(--gold);--accent-soft:var(--gold-soft);}
#zone-teacher{--accent:var(--green);--accent-soft:var(--green-soft);}
#zone-student{--accent:var(--violet);--accent-soft:var(--violet-soft);}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.zone-top{display:flex;align-items:center;gap:12px;margin-top:26px;}
.crumb{font-size:13px;color:var(--text-faint);letter-spacing:.12em;}
.crumb i{font-style:normal;margin:0 8px;opacity:.6;}
.crumb b{color:var(--text-dim);font-weight:500;}
.back{
  display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;border-radius:999px;cursor:pointer;
  background:var(--bg-card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--text-dim);
  transition:color .2s,border-color .2s,transform .2s;
}
.back:hover{color:var(--accent);border-color:var(--accent);transform:translateX(-2px);}
#zone-admin{--hero-a:#c49a52;--hero-b:#8c6a2c;}
#zone-teacher{--hero-a:#6f9c83;--hero-b:#3f6a52;}
#zone-student{--hero-a:#9a7ab4;--hero-b:#5f4579;}
.zone-hero{
  position:relative;overflow:hidden;margin-top:16px;padding:26px 24px 24px;border-radius:24px;color:#fff;
  background:radial-gradient(120% 140% at 0% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(135deg,var(--hero-a),var(--hero-b));
  box-shadow:0 14px 34px -12px var(--hero-b);
}
.zone-hero::after{
  content:attr(data-mark);position:absolute;right:-6px;bottom:-34px;font-family:'Noto Serif TC',serif;font-weight:900;
  font-size:170px;line-height:1;color:#fff;opacity:.13;pointer-events:none;
}
.zone-hero::before{ /* 細框線裝飾 */
  content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.22);border-radius:18px;pointer-events:none;
}
.hero-tag{
  position:relative;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.18);font-size:12px;letter-spacing:.14em;
}
.hero-tag svg.i{width:13px;height:13px;}
.zone-title{position:relative;display:block;margin-top:14px;font-family:'Noto Serif TC',serif;font-weight:900;font-size:34px;letter-spacing:.16em;line-height:1.2;color:#fff;}
.hero-desc{position:relative;margin-top:6px;font-size:14px;letter-spacing:.14em;opacity:.88;}

.cat{margin-top:30px;}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.cat-head .cat-name{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:var(--fs-cat);letter-spacing:.2em;color:var(--text);
}
.cat-head .cat-name::before{content:"";width:4px;height:16px;border-radius:4px;background:var(--accent);}
.cat-head::after{content:"";flex:1;min-width:40px;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent);order:10;}
.cat-head .count{display:none;}

/* ---------- 系統圖塊 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.card{
  position:relative;display:flex;flex-direction:column;gap:4px;min-height:178px;
  padding:18px 16px 14px;text-decoration:none;color:var(--text);cursor:pointer;
  background:var(--bg-card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--accent);}
.card:active{transform:scale(.98);}
.card .seal{
  display:grid;place-items:center;width:48px;height:48px;margin-bottom:12px;border-radius:15px;
  font-family:'Noto Serif TC',serif;font-weight:900;font-size:23px;color:var(--accent);
  background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-soft),inset 0 0 0 4px var(--bg-card),inset 0 0 0 5px var(--accent-soft);
  transition:background .2s,color .2s;
}
.card:hover .seal{background:var(--accent);color:#fff;box-shadow:none;}
.card .name{font-family:'Noto Serif TC',serif;font-weight:700;font-size:var(--fs-card-title);letter-spacing:.04em;line-height:1.4;}
.card .desc{color:var(--text-dim);font-size:.82em;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card .foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card .kind{font-size:11px;letter-spacing:.12em;color:var(--text-faint);}
.card .go{
  display:grid;place-items:center;width:30px;height:30px;border-radius:999px;flex-shrink:0;
  background:var(--accent-soft);color:var(--accent);transition:background .2s,color .2s,transform .2s;
}
.card .go svg.i{width:15px;height:15px;}
.card:hover .go{background:var(--accent);color:#fff;transform:rotate(-8deg) scale(1.05);}
.card.is-local .seal{background:var(--bg-2);color:var(--text-dim);box-shadow:inset 0 0 0 1px var(--line-strong);}
.card.is-local .go{background:transparent;border:1px dashed var(--line-strong);color:var(--text-dim);}
.card.is-empty{opacity:.6;}
.card.is-empty .kind{color:var(--danger);}
.empty{
  grid-column:1/-1;padding:22px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:20px;
  color:var(--text-faint);font-size:13px;letter-spacing:.16em;
}

/* ---------- 編輯模式 ---------- */
body:not(.editing) .edit-only{display:none!important;}
body.editing .edit-only{display:inline-flex;}
body.editing .card{padding-top:52px;}
.mini{
  display:inline-flex;align-items:center;gap:4px;height:30px;min-width:30px;justify-content:center;padding:0 10px;
  border:1px solid var(--line-strong);background:var(--bg-2);color:var(--text-dim);
  border-radius:999px;font-size:12.5px;cursor:pointer;transition:color .2s,border-color .2s,background .2s;
}
.mini:hover{color:var(--accent);border-color:var(--accent);}
.mini.danger:hover{color:var(--danger);border-color:var(--danger);}
.card .card-tools{position:absolute;top:10px;left:10px;right:10px;display:none;gap:4px;}
.card .card-tools .mini{padding:0;width:28px;height:28px;min-width:28px;}
.card .card-tools .mini.danger{margin-left:auto;}
body.editing .card .card-tools{display:flex;}

.add-cat{
  margin-top:28px;width:100%;padding:16px;align-items:center;justify-content:center;gap:8px;
  border:1.5px dashed var(--line-strong);background:transparent;color:var(--text-dim);
  border-radius:var(--radius);cursor:pointer;font-size:.95em;letter-spacing:.12em;transition:color .2s,border-color .2s,background .2s;
}
.add-cat:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
#editbar{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9;display:none;
  width:calc(100% - 32px);max-width:560px;flex-wrap:wrap;align-items:center;gap:10px;
  padding:10px;background:var(--bg-card);border:1px solid var(--line-strong);border-radius:20px;
  box-shadow:0 16px 40px rgba(60,45,20,.18);
}
body.editing #editbar{display:flex;}
#editbar button{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;
  border-radius:14px;border:1px solid var(--line-strong);cursor:pointer;font-size:15px;letter-spacing:.08em;transition:filter .2s,background .2s;
}
#btn-save{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700;flex:1.6;}
#btn-save:hover{filter:brightness(1.08);}
#btn-exit{background:transparent;color:var(--text);}
#btn-exit:hover{background:var(--bg-card-hover);}
#save-status{font-size:.82em;color:var(--text-dim);width:100%;text-align:center;}
#save-status:empty{display:none;}

/* ---------- 彈窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(40,30,15,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;}
.modal.show{display:flex;animation:fade .2s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal .box{
  background:var(--bg-card);border:1px solid var(--line-strong);border-radius:22px;width:100%;max-width:440px;
  padding:26px 24px 22px;line-height:1.75;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(60,45,20,.22);
  animation:pop .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.modal .box > b:first-child,#local-tip-text b{display:block;font-family:'Noto Serif TC',serif;font-size:1.2em;color:var(--gold);letter-spacing:.08em;margin-bottom:4px;}
.modal label{display:block;margin-top:14px;font-size:.82em;letter-spacing:.1em;color:var(--text-dim);}
.modal input[type=text],.modal input[type=date],.modal textarea,.modal select{
  width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line-strong);background:var(--bg);color:var(--text);
  font-family:inherit;font-size:15px;letter-spacing:0;transition:border-color .2s,box-shadow .2s;
}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
.modal textarea{min-height:70px;resize:vertical;line-height:1.6;}
.modal .row{display:flex;gap:10px;margin-top:22px;}
.modal .row button{flex:1;height:46px;border-radius:14px;border:1px solid var(--line-strong);cursor:pointer;font-size:15px;letter-spacing:.1em;background:transparent;color:var(--text);transition:background .2s,filter .2s;}
.modal .row button:hover{background:var(--bg-card-hover);}
.modal .row .primary{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700;}
.modal .row .primary:hover{background:var(--gold);filter:brightness(1.08);}

/* ---------- 公告區 ---------- */
.board{
  margin-top:16px;position:relative;overflow:hidden;
  background:var(--bg-card);
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);
}
.board-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.board-head .board-title{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2em;font-size:.92em;color:var(--accent);}
.ann-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);line-height:1.7;flex-wrap:wrap;}
.ann-item:first-of-type{border-top:none;margin-top:6px;}
.ann-date{flex-shrink:0;color:var(--text-faint);font-size:.8em;padding-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.04em;}
.ann-new{flex-shrink:0;font-size:10px;font-weight:700;background:var(--danger);color:#fff;border-radius:999px;padding:2px 8px;letter-spacing:.12em;margin-top:4px;}
.ann-text{white-space:pre-wrap;word-break:break-word;flex:1;min-width:180px;}
.ann-tools{display:none;gap:6px;flex-shrink:0;}
body.editing .ann-tools{display:flex;}

/* ---------- 行事曆 ---------- */
.cal{margin-top:16px;background:var(--bg-card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;box-shadow:var(--shadow);}
.cal-head{display:flex;align-items:center;gap:8px;}
.cal-title{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.16em;font-size:.95em;color:var(--accent);}
.cal-month{margin-left:auto;display:flex;align-items:center;gap:4px;}
.cal-month b{min-width:92px;text-align:center;font-size:.95em;letter-spacing:.06em;font-variant-numeric:tabular-nums;}
.cal-nav{display:grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;color:var(--text-dim);}
.cal-nav:hover{color:var(--accent);border-color:var(--accent);}
.cal-nav svg.i{width:15px;height:15px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px;}
.cal-wd{text-align:center;font-size:11px;color:var(--text-faint);padding:2px 0 4px;letter-spacing:.1em;}
.cal-day{
  position:relative;min-height:66px;border:0;border-radius:10px;background:transparent;cursor:pointer;padding:4px 2px 5px;min-width:0;
  display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;font-size:14px;color:var(--text);
  font-variant-numeric:tabular-nums;transition:background .15s;
}
.cal-day:hover{background:var(--bg-2);}
.cal-day.out{color:var(--text-faint);opacity:.45;}
.cal-day.today .dnum{background:var(--accent);color:#fff;font-weight:700;}
.cal-day.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal-day .dnum{display:grid;place-items:center;width:22px;height:22px;border-radius:999px;font-size:13px;line-height:1;margin:0 auto 1px;}
.cal-day .chip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;font-size:10px;line-height:1.3;font-weight:700;
  letter-spacing:0;padding:1px 2px;border-radius:4px;word-break:break-all;text-align:center;}
@media (max-width:639px){ #cal-panel{padding:14px 8px 12px;} .calview-body{padding:4px 10px 48px;} .cal-day{padding:3px 1px 4px;} .cal-grid{gap:2px;} #cal-panel .cal-head{padding:0 6px;} }

const sbHeaders = ()=>({ "apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY, "Content-Type":"application/json" });
const sbReady = ()=> SUPABASE_URL && SUPABASE_KEY;

async function loadConfig(){
  // 先用這台裝置上次存的資料馬上畫出來（不用等網路），雲端資料回來後再更新
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem("portal-config") || "null"); }catch(e){}
  state = (cached && cached.admin) ? cached : structuredClone(DEFAULT_CONFIG);   // 沒有存過就用內建的最新一份
  renderAll();
  if(sbReady()){
    try{
      let rows = window.__cfgP ? await window.__cfgP : null; window.__cfgP = null;
      if(!rows){ const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${ROW_ID}&select=data`,{headers:sbHeaders()}); rows = r.ok ? await r.json() : null; }
      if(rows){
        if(rows.length && rows[0].data && rows[0].data.admin){
          if(editing) return;                       // 編輯中不要蓋掉正在改的內容
          state = rows[0].data;
          try{ localStorage.setItem("portal-config", JSON.stringify(state)); }catch(e){}
          renderAll(); prefetchZone(currentZone); return;
        }
      }
    }catch(e){ console.warn("Supabase 讀取失敗，改用本機資料", e); }
  }
  if(!state){ state = structuredClone(DEFAULT_CONFIG); renderAll(); }
}
// 進到某一區時，先在背景把那一區的系統暖身，點下去開得比較快
const prefetched = new Set();
let currentZone = null;
function prefetchZone(zone){
  if(!zone || !state || !state[zone]) return;
  const add = (rel, href, extra) => {
    if(prefetched.has(rel+href)) return; prefetched.add(rel+href);
    const l = document.createElement("link"); l.rel = rel; l.href = href; if(extra) Object.assign(l, extra);
    document.head.appendChild(l);
  };
  state[zone].forEach(cat=> cat.items.forEach(it=>{
    if(it.type === "gallery" && it.images && it.images[0]){     // 圖片：先把第一張抓好
      add("preconnect", "https://lh3.googleusercontent.com");
      add("prefetch", imgUrl(it.images[0].id, 1200), {as:"image"});
      return;
    }
    if(it.type !== "web" || !it.url) return;
    let u; try{ u = new URL(it.url); }catch(e){ return; }
    if(u.hostname === "kevin87265-pixel.github.io") add("prefetch", u.href);          // 自己的系統：先抓好頁面
    else add("preconnect", u.origin, {crossOrigin:"anonymous"});                      // 外部：先把連線接好
    if(u.hostname === "drive.google.com" || u.hostname === "docs.google.com"){
      add("preconnect", "https://drive.google.com"); add("preconnect", "https://docs.google.com");
      add("preconnect", "https://www.gstatic.com", {crossOrigin:"anonymous"});
    }
  }));
}

async function saveConfig(){
  localStorage.setItem("portal-config", JSON.stringify(state));
  if(!sbReady()){
    $("#save-status").textContent = "已儲存（單機模式：尚未設定 Supabase key，其他裝置看不到變更）";
    return;
  }
  $("#save-status").textContent = "儲存中…";
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{
      method:"POST",
      headers:{...sbHeaders(), "Prefer":"return=minimal,resolution=merge-duplicates"},
      body:JSON.stringify({ id:ROW_ID, table_name:"portal_config", row_key:"main",
                            data:state, updated_at:new Date().toISOString() })
    });
    $("#save-status").textContent = r.ok ? "✅ 已同步到雲端，所有裝置都會看到" : "⚠️ 雲端儲存失敗（已存本機）";
  }catch(e){
    $("#save-status").textContent = "⚠️ 網路問題，僅存本機";
  }
}

function makeCard(item, zoneKey, ci, ii){
  let el;
  if(item.type === "calendar"){
    el = document.createElement("div");
    el.className = "is-cal"; el.tabIndex = 0;
    const nx = upcoming(zoneKey, 60)[0];
    const sub = nx ? `下一個：<b>${dateLabel(nx).replace(/（.）/g,"")}</b> ${esc(evLook(nx).label)}` : esc(item.desc || "出單・法會・課程時間");
    el.innerHTML = `<span class="seal">曆</span>
                    <span class="name">${esc(item.name || "行事曆")}</span>
                    <span class="desc">${sub}</span>
                    <span class="foot"><span class="kind">${zoneKey==="admin" ? "點進去新增・修改" : "點開看行事曆"}</span><span class="go"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span></span>`;
    const go = ()=>{ if(!editing) openCal(zoneKey); };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
  }else if(item.type === "gallery"){
    el = document.createElement("div");
    el.className = "is-gal"; el.tabIndex = 0;
    const n = (item.images||[]).length;
    el.innerHTML = `<span class="seal">${esc(Array.from(item.name||"・")[0])}</span>
                    <span class="name">${esc(item.name)}</span>
                    <span class="desc">${esc(item.desc)}</span>
                    <span class="foot">${item.tag ? `<span class="kind tag">${esc(item.tag)}</span>` : `<span class="kind">${n>1 ? n+" 張圖・點開看" : "點開看圖"}</span>`}<span class="go"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg></span></span>`;
    const go = ()=>{ if(!editing) openGallery(item); };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
  }else if(item.type === "line"){
    el = document.createElement("div");
    el.className = "is-line"; el.tabIndex = 0;
    el.innerHTML = `<span class="seal">LINE</span>
                    <span class="name">${esc(item.name)}</span>
                    <span class="desc">${esc(item.desc)}</span>
                    <span class="foot">${item.tag ? `<span class="kind tag">${esc(item.tag)}</span>` : `<span class="kind">點開複製・分享</span>`}<span class="go"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg></span></span>`;
    el.querySelector(".seal").style.fontSize = "13px";
    const go = ()=>{ if(!editing) openLine(item); };
    el.addEventListener("click", go);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
  }else if(item.type === "web"){
    el = document.createElement("a");
    el.href = item.url || "#"; el.target = "_blank"; el.rel = "noopener";
    el.innerHTML = `<span class="seal">${esc(Array.from(item.name||"・")[0])}</span>
                    <span class="name">${esc(item.name)}</span>
                    <span class="desc">${esc(item.desc)}</span>
                    <span class="foot">${item.tag ? `<span class="kind tag">${esc(item.tag)}</span>` : `<span class="kind">${item.url ? "線上系統" : "連結待設定"}</span>`}<span class="go"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span></span>`;
    if(!item.url) el.classList.add("is-empty");
    el.addEventListener("click", e=>{
      if(editing){ e.preventDefault(); return; }
      if(!item.url){ e.preventDefault(); alert("這個系統的連結還沒設定"); return; }
      if(canEmbed(item.url)){ e.preventDefault(); openViewer(item); }
    });
  }else{
    const isNote = item.type === "note";
    el = document.createElement("div");
    el.className = "is-local"; el.tabIndex = 0;
    el.innerHTML = `<span class="seal">${esc(Array.from(item.name||"・")[0])}</span>
                    <span class="name">${esc(item.name)}</span>
                    <span class="desc">${esc(item.desc)}</span>
                    <span class="foot"><span class="kind">${isNote ? "說明・點開看" : "電腦本機工具"}</span><span class="go">${isNote ? `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>` : `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>`}</span></span>`;
    if(isNote) el.classList.add("is-note");
    const showTip = ()=>{
      if(editing) return;
      $("#local-tip-text").innerHTML =
        `<b>${esc(item.name)}</b><br>${esc(item.hint||"").replace(/\n/g,"<br>")}`;
      $("#local-tip").classList.add("show");
    };
    el.addEventListener("click", showTip);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter") showTip(); });
  }
  el.classList.add("card");
  const tools = document.createElement("span");
  tools.className = "card-tools";
  tools.innerHTML = `<button class="mini" data-a="up" title="上移"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><button class="mini" data-a="down" title="下移"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><button class="mini" data-a="edit" title="編輯"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button><button class="mini danger" data-a="del" title="刪除"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  tools.addEventListener("click", e=>{
    e.preventDefault(); e.stopPropagation();
    const a = e.target.dataset.a; if(!a) return;
    const items = state[zoneKey][ci].items;
    if(a==="del" && confirm(`刪除「${item.name}」？`)) items.splice(ii,1);
    if(a==="up" && ii>0) [items[ii-1],items[ii]]=[items[ii],items[ii-1]];
    if(a==="down" && ii<items.length-1) [items[ii+1],items[ii]]=[items[ii],items[ii+1]];
    if(a==="edit"){ openItemModal(zoneKey, ci, ii); return; }
    renderAll();
  });
  el.appendChild(tools);
  return el;
}

function renderZone(zoneKey, sectionId){
  const catsWrap = document.querySelector(`#${sectionId} .cats`);
  catsWrap.innerHTML = "";
  state[zoneKey].forEach((cat, ci)=>{
    const sec = document.createElement("section");
    sec.className = "cat";
    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `<span class="cat-name">${esc(cat.category)}</span>
      <button class="mini edit-only" data-a="rename"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>改名</button>
      <button class="mini edit-only" data-a="up" title="上移"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="mini edit-only" data-a="down" title="下移"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="mini edit-only" data-a="add"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增系統</button>
      <button class="mini danger edit-only" data-a="delcat"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>刪分類</button>`;
    head.addEventListener("click", e=>{
      const a = e.target.dataset.a; if(!a) return;
      const cats = state[zoneKey];
      if(a==="rename"){ const n = prompt("分類名稱：", cat.category); if(n) cat.category = n.trim(); }
      if(a==="up" && ci>0) [cats[ci-1],cats[ci]]=[cats[ci],cats[ci-1]];
      if(a==="down" && ci<cats.length-1) [cats[ci+1],cats[ci]]=[cats[ci],cats[ci+1]];
      if(a==="add"){ openItemModal(zoneKey, ci, null); return; }
      if(a==="delcat"){
        if(cat.items.length && !confirm(`「${cat.category}」內有 ${cat.items.length} 個系統，一併刪除？`)) return;
        if(!cat.items.length && !confirm(`刪除分類「${cat.category}」？`)) return;
        cats.splice(ci,1);
      }
      renderAll();
    });
    sec.appendChild(head);
    const grid = document.createElement("div");
    grid.className = "grid";
    cat.items.forEach((item, ii)=> grid.appendChild(makeCard(item, zoneKey, ci, ii)));
    if(!cat.items.length && !editing){ grid.innerHTML = '<div class="empty">內容整理中，即將開放</div>'; }
    sec.appendChild(grid);
    catsWrap.appendChild(sec);
  });
}
/* ---------- 公告區 ---------- */
function ensureAnn(){ if(!state.ann) state.ann = {}; state.ann.admin ||= []; state.ann.teacher ||= []; state.ann.student ||= []; if(!state.student) state.student = structuredClone(DEFAULT_CONFIG.student); }
function isNew(dateStr){
  const d = new Date(dateStr); if(isNaN(d)) return false;
  return (Date.now() - d.getTime()) < 7*24*60*60*1000;
}
let annTarget = null; // {zoneKey, idx|null}
function openAnnModal(zoneKey, idx){
  annTarget = {zoneKey, idx};
  const isAdd = idx === null;
  const a = isAdd ? {date:new Date().toISOString().slice(0,10), text:""} : state.ann[zoneKey][idx];
  $("#ann-modal-title").textContent = isAdd ? "新增公告" : "編輯公告";
  $("#a-date").value = a.date||"";
  $("#a-text").value = a.text||"";
  $("#ann-modal").classList.add("show");
}
$("#a-submit").addEventListener("click", ()=>{
  const {zoneKey, idx} = annTarget;
  const a = { date: $("#a-date").value.trim(), text: $("#a-text").value.trim() };
  if(!a.text){ closeModal("ann-modal"); return; }
  if(idx===null) state.ann[zoneKey].unshift(a);
  else state.ann[zoneKey][idx] = a;
  closeModal("ann-modal");
  renderAll();
});
function renderBoard(zoneKey){
  ensureAnn();
  const wrap = document.querySelector(`[data-board="${zoneKey}"]`);
  const list = state.ann[zoneKey];
  const wk = new Date(); wk.setDate(wk.getDate()+7); const wkK = ymd(wk);
  const auto = zoneKey === "admin" ? [] : upcoming(zoneKey, 30)      // 行政排進行事曆的，近 30 天自動變公告
    .filter(e=> e.type !== "course" || e.date <= wkK).slice(0, 6);      // 課程只提醒 7 天內的，免得公告被洗版
  wrap.innerHTML = "";
  if(!editing && list.length===0 && auto.length===0){ wrap.style.display="none"; return; }
  wrap.style.display = "block";
  const head = document.createElement("div");
  head.className = "board-head";
  head.innerHTML = `<span class="board-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>公告</span>
    <button class="mini edit-only" data-a="add"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增公告</button>`;
  head.addEventListener("click", e=>{
    if(e.target.dataset.a==="add") openAnnModal(zoneKey, null);
  });
  wrap.appendChild(head);
  auto.forEach(e=>{
    const t = evLook(e); const row = document.createElement("div");
    row.className = "ann-item auto";
    row.innerHTML = `<span class="ann-date">${dateLabel(e)}</span>
      <span class="ann-text"><span class="ev-tag" style="background:${t.color}">${esc(tagLabel(e))}</span>${esc(e.title)}${e.time?`・${esc(e.time)}`:""}${e.note?`<br><span style="color:var(--text-dim);font-size:.92em;white-space:pre-wrap">${esc(e.note)}</span>`:""}</span>`;
    wrap.appendChild(row);
  });
  list.forEach((a, idx)=>{
    const row = document.createElement("div");
    row.className = "ann-item";
    row.innerHTML = `<span class="ann-date">${esc(a.date||"")}</span>
      ${isNew(a.date) ? '<span class="ann-new">NEW</span>' : ''}
      <span class="ann-text">${esc(a.text)}</span>
      <span class="ann-tools">
        <button class="mini" data-a="edit" title="編輯"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button><button class="mini danger" data-a="del" title="刪除"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>`;
    row.addEventListener("click", e=>{
      const act = e.target.dataset.a; if(!act) return;
      if(act==="edit") openAnnModal(zoneKey, idx);
      if(act==="del" && confirm("刪除這則公告？")){ state.ann[zoneKey].splice(idx,1); renderAll(); }
    });
    wrap.appendChild(row);
  });
}

/* ---------- 內嵌系統視窗 ---------- */
// 能在入口頁裡面開的網址：自己的系統 + Google 雲端（轉成可預覽格式）；其他一律開新分頁
function embedUrl(url){
  let u; try{ u = new URL(url, location.href); }catch(e){ return null; }
  if(!/^https?:$/.test(u.protocol)) return null;
  if(u.hostname === "kevin87265-pixel.github.io") return u.href;
  if(u.hostname === "drive.google.com"){
    let m = u.pathname.match(/\/file\/d\/([^/]+)/);
    if(m) return `https://drive.google.com/file/d/${m[1]}/preview`;
    m = u.pathname.match(/\/folders\/([^/]+)/);
    if(m) return `https://drive.google.com/embeddedfolderview?id=${m[1]}#grid`;
    const id = u.searchParams.get("id"); if(id) return `https://drive.google.com/file/d/${id}/preview`;
  }
  if(u.hostname === "docs.google.com"){
    const m = u.pathname.match(/^\/(document|presentation)\/d\/([^/]+)/);
    if(m) return `https://docs.google.com/${m[1]}/d/${m[2]}/preview`;
  }
  return null;
}
function canEmbed(url){ return !!embedUrl(url); }
function openViewer(item){
  $("#viewer-title").textContent = item.name || "";
  $("#viewer-ext").href = item.url;
  $("#viewer-load").style.display = "block";
  const f = $("#viewer-frame");
  f.onload = ()=> $("#viewer-load").style.display = "none";
  f.src = embedUrl(item.url) || item.url;
  $("#viewer").classList.add("show"); $("#viewer").setAttribute("aria-hidden","false");
  document.body.classList.add("viewing");
  try{ history.pushState({viewer:1}, ""); }catch(e){}
}
function closeViewer(fromPop){
  if(!$("#viewer").classList.contains("show")) return;
  $("#viewer").classList.remove("show"); $("#viewer").setAttribute("aria-hidden","true");
  document.body.classList.remove("viewing");
  $("#viewer-frame").src = "about:blank";
  if(!fromPop){ try{ if(history.state && history.state.viewer) history.back(); }catch(e){} }
}
$("#viewer-close").addEventListener("click", ()=> closeViewer(false));
window.addEventListener("popstate", ()=> closeViewer(true));

/* ---------- 圖片集：雲端圖片直接顯示，不跳到 Google 雲端 ---------- */
function driveId(link){
  const m = String(link).match(/\/d\/([\w-]{20,})/) || String(link).match(/[?&]id=([\w-]{20,})/) || String(link).match(/^([\w-]{25,})$/);
  return m ? m[1] : null;
}
const imgUrl = (id, w) => `https://lh3.googleusercontent.com/d/${id}=w${w}`;
function openGallery(item){
  const imgs = item.images || [];
  $("#gallery-title").textContent = item.name || "";
  const nav = imgs.length > 2 ? `<div class="gal-nav">${imgs.map((m,i)=>`<button type="button" data-j="${i}">${esc(m.title||("第"+(i+1)+"張"))}</button>`).join("")}</div>` : "";
  $("#gallery-body").innerHTML = nav + `<p class="gal-tip">點圖片可以放大看</p>` + imgs.map((m,i)=>`
    <div class="gal-item" id="gal-${i}">${m.title ? `<h3>${esc(m.title)}</h3>` : ""}
      <img src="${imgUrl(m.id,1200)}" data-id="${esc(m.id)}" alt="${esc(m.title||"")}" ${i>1?'loading="lazy"':''} decoding="async"
        onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='https://drive.google.com/thumbnail?id=${esc(m.id)}&sz=w1200';}"></div>`).join("");
  $("#gallery-body").scrollTop = 0;
  $("#gallery").classList.add("show"); $("#gallery").setAttribute("aria-hidden","false");
  document.body.classList.add("viewing");
  try{ history.pushState({gallery:1}, ""); }catch(e){}
}
$("#gallery-body").addEventListener("click", e=>{
  const b = e.target.closest("[data-j]");
  if(b){ document.getElementById("gal-"+b.dataset.j).scrollIntoView({behavior:"smooth"}); return; }
  const img = e.target.closest("img[data-id]");
  if(img){
    const z = $("#zoom"); z.classList.remove("big");
    $("#zoom-img").src = img.currentSrc || img.src;                 // 先用已經載好的，再換高畫質
    const hi = new Image(); hi.onload = ()=>{ if(z.classList.contains("show")) $("#zoom-img").src = hi.src; }; hi.src = imgUrl(img.dataset.id, 2400);
    z.classList.add("show"); z.scrollTo(0,0);
    try{ history.pushState({zoom:1}, ""); }catch(e){}
  }
});
$("#zoom-img").addEventListener("click", e=>{ e.stopPropagation(); $("#zoom").classList.toggle("big"); });
function closeZoom(fromPop){
  if(!$("#zoom").classList.contains("show")) return false;
  $("#zoom").classList.remove("show","big");
  if(!fromPop){ try{ if(history.state && history.state.zoom) history.back(); }catch(e){} }
  return true;
}
$("#zoom-close").addEventListener("click", ()=> closeZoom(false));
function closeGallery(fromPop){
  if(!$("#gallery").classList.contains("show")) return;
  $("#gallery").classList.remove("show"); $("#gallery").setAttribute("aria-hidden","true");
  document.body.classList.remove("viewing");
  if(!fromPop){ try{ if(history.state && history.state.gallery) history.back(); }catch(e){} }
}
$("#gallery-close").addEventListener("click", ()=> closeGallery(false));
window.addEventListener("popstate", ()=>{ if(closeZoom(true)) return; closeGallery(true); });

/* ---------- 官方LINE：複製連結／ID、傳給好友 ---------- */
let lineItem = null;
function lineText(it){ return `${it.name || "官方 LINE"}\n加好友連結：${it.url}${it.lineId ? `\nLINE ID：${it.lineId}` : ""}`; }
function openLine(item){
  lineItem = item;
  $("#line-title").textContent = item.name || "官方 LINE";
  $("#line-id").textContent = item.lineId || "（未設定）";
  $("#line-url").textContent = item.url || "";
  $("#line-share").href = "https://line.me/R/msg/text/?" + encodeURIComponent(lineText(item));
  $("#line-open").href = item.url || "#";
  $("#line-modal").classList.add("show");
}
async function copyText(t, okMsg){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = t; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove(); }
  toast(okMsg);
}
$("#line-copy-url").addEventListener("click", ()=> copyText(lineItem.url, "連結已複製，可以貼給別人"));
$("#line-copy-id").addEventListener("click", ()=> copyText(lineItem.lineId||"", "LINE ID 已複製"));
$("#line-copy-all").addEventListener("click", ()=> copyText(lineText(lineItem), "整段介紹已複製"));

/* ---------- 行事曆（行政填一份，三區自動同步） ----------
   state.events = [{id,type,date,end,time,title,note,to:{teacher,student}}]
   行政區看全部；老師區/學員區只看勾選給他們的；「行政內部」只有行政看得到 */
const WD = ["日","一","二","三","四","五","六"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const EV_TYPES = {
  order:   { label:"出單截止", color:"#c0892c", to:{teacher:true,  student:false} },
  ritual:  { label:"法會",     color:"#b5523d", to:{teacher:true,  student:true } },
  course:  { label:"課程",     color:"#4f8a6c", to:{teacher:true,  student:true } },
  other:   { label:"活動",     color:"#7b62a0", to:{teacher:true,  student:true } },
  internal:{ label:"內部",     color:"#8d8579", to:{teacher:false, student:false} },
};
const evType = e => EV_TYPES[e.type] || EV_TYPES.other;
// 課程有很多種：每一種課自動配一個顏色，格子和清單直接寫課名
const COURSE_PRESETS = ["八字","塔羅","紫微斗數","六爻","神奇培訓班"];
const COURSE_COLORS = ["#2f7d5b","#2e6fa3","#8a4fb0","#b0457a","#3b8c8c","#6b7d2a","#4a5fc0","#a8642a"];
function courseColor(name){
  const i = COURSE_PRESETS.findIndex(p=> name.startsWith(p));
  if(i>=0) return COURSE_COLORS[i];
  let h = 0; for(const ch of name) h = (h*31 + ch.codePointAt(0)) >>> 0;
  return COURSE_COLORS[5 + (h % 3)];
}
function evLook(e){
  if(e.type === "course" && e.course) return { label:e.course, color:courseColor(e.course) };
  return evType(e);
}
function tagLabel(e){ return (e.type==="course" && e.course && e.title===e.course) ? "課程" : evLook(e).label; }
function chipText(e){
  if(e.type === "order") return "出單截止";
  if(e.type === "course") return e.course || e.title;
  return e.title;
}
const calView = {};                         // 各區目前看的月份與選取日
const calOpen = { admin:true, teacher:false, student:false };  // 老師/學員區預設收起來
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function ensureCal(){
  if(!Array.isArray(state.events)) state.events = [];
  // 舊版三區各一份的資料 → 併進共用清單
  if(state.cal){
    const map = { admin:{teacher:false,student:false}, teacher:{teacher:true,student:false}, student:{teacher:false,student:true} };
    Object.keys(map).forEach(z=> (state.cal[z]||[]).forEach(e=> state.events.push({ id:newId(), type: z==="admin"?"internal":"other", date:e.date, end:"", time:e.time||"", title:e.title, note:e.note||"", to:map[z] })));
    delete state.cal;
  }
  state.events.forEach(e=>{ if(!e.id) e.id = newId(); if(!e.to) e.to = {...evType(e).to}; });
}
function visibleTo(e, zoneKey){
  if(zoneKey === "admin") return true;
  if(e.type === "internal") return false;
  return !!(e.to && e.to[zoneKey]);
}
function zoneEvents(zoneKey){ ensureCal(); return state.events.filter(e=> visibleTo(e, zoneKey)); }
function eachDay(e, fn){              // 多天活動：每一天都算
  const s = new Date(e.date+"T00:00"); if(isNaN(s)) return;
  let t = e.end && e.end > e.date ? new Date(e.end+"T00:00") : s;
  for(let d = new Date(s), n=0; d <= t && n < 62; d.setDate(d.getDate()+1), n++) fn(ymd(d));
}
function dateLabel(e){
  const f = k => { const d = new Date(k+"T00:00"); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
  return e.end && e.end > e.date ? `${f(e.date)}～${f(e.end)}` : f(e.date);
}
function upcoming(zoneKey, days){
  const today = ymd(new Date());
  const lim = new Date(); lim.setDate(lim.getDate()+days); const limK = ymd(lim);
  return zoneEvents(zoneKey).filter(e=> (e.end && e.end > e.date ? e.end : e.date) >= today && e.date <= limK)
    .sort((a,b)=> (a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
}
function renderCal(zoneKey){
  const wrap = $("#cal-panel"); if(calZone !== zoneKey) return;
  const isAdmin = zoneKey === "admin";
  const events = zoneEvents(zoneKey);
  const today = new Date();
  const v = calView[zoneKey] ||= { y: today.getFullYear(), m: today.getMonth(), sel: ymd(today) };
  const byDay = {};
  events.forEach(e=> eachDay(e, k=> (byDay[k] ||= []).push(e)));
  const first = new Date(v.y, v.m, 1);
  const start = new Date(v.y, v.m, 1 - first.getDay());
  let cells = WD.map(w=>`<div class="cal-wd">${w}</div>`).join("");
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if(i>=35 && d.getMonth()!==v.m) break;
    const k = ymd(d), evs = (byDay[k]||[]);
    const cls = ["cal-day", d.getMonth()!==v.m?"out":"", k===ymd(today)?"today":"", k===v.sel?"sel":""].join(" ");
    const chips = evs.slice(0,3).map(e=>{ const c = evLook(e).color; return `<span class="chip" style="background:${c}1c;color:${c}">${esc(chipText(e))}</span>`; }).join("")
                + (evs.length>3 ? `<span class="more">+${evs.length-3}</span>` : "");
    cells += `<button type="button" class="${cls}" data-d="${k}"><span class="dnum">${d.getDate()}</span>${chips}</button>`;
  }
  // 清單：選取日有活動就列那天，否則列本月全部
  const monthKey = `${v.y}-${pad(v.m+1)}`;
  let list = (byDay[v.sel]||[]);
  let listTitle = `${Number(v.sel.slice(5,7))}月${Number(v.sel.slice(8))}日`;
  if(!list.length){ list = events.filter(e=> (e.date||"").slice(0,7) <= monthKey && ((e.end&&e.end>e.date?e.end:e.date)||"").slice(0,7) >= monthKey); listTitle = `${v.m+1}月全部活動`; }
  list = list.slice().sort((a,b)=> (a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  const items = list.map(e=>{
    const t = evLook(e); const dd = new Date(e.date+"T00:00");
    const who = isAdmin ? (e.type==="internal" ? "只有行政" : [e.to?.teacher?"老師":"", e.to?.student?"學員":""].filter(Boolean).join("、") || "只有行政") : "";
    return `<div class="ev${isAdmin?" can-edit":""}" data-id="${esc(e.id)}"><span class="ev-date" style="background:${t.color}1f;color:${t.color}"><b>${dd.getDate()}</b><small>週${WD[dd.getDay()]}</small></span>
      <span class="ev-body"><span class="ev-title"><span class="ev-tag" style="background:${t.color}">${esc(tagLabel(e))}</span>${esc(e.title)}</span>
      <div class="ev-meta">${esc([e.end&&e.end>e.date?dateLabel(e):"", e.time, e.note].filter(Boolean).join("・"))}${who?`<span class="ev-lock">（${who}看得到）</span>`:""}</div></span></div>`;
  }).join("") || `<div class="cal-empty">這段時間沒有活動</div>`;
  const next = upcoming(zoneKey, 60)[0];
  const nextHtml = next ? `接下來：<b>${dateLabel(next)}</b> ${esc(evLook(next).label)}・${esc(next.title)}${next.time?`（${esc(next.time)}）`:""}` : "近期沒有排定的活動";
  const monthCourses = [...new Set(events.filter(e=> e.type==="course" && e.course && (e.date||"").slice(0,7)===monthKey).map(e=> e.course))];
  const legend = Object.entries(EV_TYPES).filter(([k,t])=> (isAdmin || t.to[zoneKey]) && !(k==="course" && monthCourses.length))
    .map(([k,t])=>`<span><i style="background:${t.color}"></i>${t.label}</span>`).join("")
    + [...new Map(monthCourses.map(n=>{ const pre = COURSE_PRESETS.find(p=> n.startsWith(p)); return [pre ? pre+"課程" : n, courseColor(n)]; }))]
        .map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join("");
  const open = true;
  wrap.classList.toggle("collapsed", !open);
  wrap.innerHTML = `<div class="cal-head"><span class="cal-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>行事曆</span>
      ${isAdmin ? `<button class="mini cal-add" data-a="add"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增</button>` : ""}
      <span class="cal-month"><button class="cal-nav" data-a="prev" aria-label="上個月"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><b>${v.y} 年 ${v.m+1} 月</b><button class="cal-nav" data-a="next" aria-label="下個月"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span>
</div>
    <div class="cal-next">${nextHtml}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">${legend}</div>
    <div class="cal-list"><div class="cal-list-h">${listTitle}</div>${isAdmin && (byDay[v.sel]||[]).length ? `<button class="mini cal-add-day" data-a="add"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>在 ${listTitle} 再新增一個</button>` : ""}${items}</div>`;
  wrap.onclick = e=>{
    const t = e.target.closest("[data-a],[data-d],.ev"); if(!t) return;
    if(t.dataset.a==="toggle"){ calOpen[zoneKey] = !calOpen[zoneKey]; }
    else if(t.dataset.a==="prev"){ v.m--; if(v.m<0){v.m=11;v.y--;} v.sel=`${v.y}-${pad(v.m+1)}-01`; }
    else if(t.dataset.a==="next"){ v.m++; if(v.m>11){v.m=0;v.y++;} v.sel=`${v.y}-${pad(v.m+1)}-01`; }
    else if(t.dataset.a==="add"){ openEvModal(null); return; }
    else if(t.dataset.d){ v.sel = t.dataset.d; if(isAdmin && !(byDay[v.sel]||[]).length){ renderCal(zoneKey); openEvModal(null); return; } }
    else if(t.classList.contains("ev")){ if(isAdmin) openEvModal(t.dataset.id); return; }
    renderCal(zoneKey);
  };
}
let calZone = null;
const ZONE_NAME = { admin:"行政區", teacher:"老師區", student:"學員區" };
function openCal(zoneKey){
  calZone = zoneKey;
  $("#calview").dataset.zone = zoneKey;
  $("#calview-title").textContent = ZONE_NAME[zoneKey] + "行事曆";
  $("#calview-hint").textContent = zoneKey === "admin"
    ? "點空白的日期就能直接新增；有活動的日期點下去，下面會出現那天的活動，點活動可以修改或刪除。勾給老師、學員的活動，會同步到他們的行事曆和公告。"
    : "行事曆由行政統一更新。";
  renderCal(zoneKey);
  $("#calview").classList.add("show"); $("#calview").setAttribute("aria-hidden","false");
  document.body.classList.add("calviewing");
  try{ history.pushState({calview:1}, ""); }catch(e){}
}
function closeCal(fromPop){
  if(!$("#calview").classList.contains("show")) return;
  $("#calview").classList.remove("show"); $("#calview").setAttribute("aria-hidden","true");
  document.body.classList.remove("calviewing");
  calZone = null; renderAll();
  if(!fromPop){ try{ if(history.state && history.state.calview) history.back(); }catch(e){} }
}
$("#calview-close").addEventListener("click", ()=> closeCal(false));
window.addEventListener("popstate", ()=>{ if($("#viewer").classList.contains("show") || $("#gallery").classList.contains("show") || $("#zoom").classList.contains("show")) return; closeCal(true); });
let evTargetId = null;
function syncEvTo(){
  const internal = $("#e-type").value === "internal";
  $("#e-to-wrap").style.display = internal ? "none" : "flex";
  $("#e-course-wrap").style.display = $("#e-type").value === "course" ? "block" : "none";
  $("#e-to-note").style.display = internal ? "block" : "none";
}
$("#e-type").addEventListener("change", ()=>{
  const d = EV_TYPES[$("#e-type").value].to;            // 換類型 → 帶入預設給誰看
  $("#e-to-teacher").checked = d.teacher; $("#e-to-student").checked = d.student; syncEvTo();
});
function openEvModal(id){
  ensureCal();
  evTargetId = id;
  const isAdd = id === null;
  const e = isAdd ? {type:"order", date:(calView.admin||{}).sel || ymd(new Date()), end:"", time:"", title:"", note:"", to:{...EV_TYPES.order.to}}
                  : state.events.find(x=> x.id===id);
  if(!e) return;
  $("#ev-modal-title").textContent = isAdd ? "新增活動" : "編輯活動";
  $("#e-type").value = EV_TYPES[e.type] ? e.type : "other";
  $("#e-date").value = e.date||""; $("#e-end").value = e.end||""; $("#e-time").value = e.time||""; $("#e-title").value = e.title||""; $("#e-note").value = e.note||"";
  $("#e-to-teacher").checked = !!e.to?.teacher; $("#e-to-student").checked = !!e.to?.student;
  $("#e-course").value = e.course || "";
  const used = [...new Set([...COURSE_PRESETS, ...state.events.filter(x=> x.course).map(x=> x.course)])];
  $("#course-list").innerHTML = used.map(n=>`<option value="${esc(n)}">`).join("");
  syncEvTo();
  $("#e-del").style.display = isAdd ? "none" : "";
  $("#ev-modal").classList.add("show");
}
// 行政改行事曆：先抓雲端最新版再改再存，避免蓋掉別人剛存的東西；編輯模式中則先改在畫面上，按「儲存」一起存
async function commitEvents(mutate, okMsg){
  if(editing){ ensureCal(); mutate(state.events); renderAll(); $("#save-status").textContent = "行事曆已改，記得按「儲存」"; return true; }
  if(!sbReady()){ alert("尚未連上雲端，無法儲存"); return false; }
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${ROW_ID}&select=data`,{headers:sbHeaders()});
    if(!r.ok) throw new Error("read "+r.status);
    const rows = await r.json();
    if(!rows.length || !rows[0].data || !rows[0].data.admin) throw new Error("no data");
    state = rows[0].data; ensureCal(); ensureAnn();
    mutate(state.events);
    const w = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{
      method:"POST",
      headers:{...sbHeaders(), "Prefer":"return=minimal,resolution=merge-duplicates"},
      body:JSON.stringify({ id:ROW_ID, table_name:"portal_config", row_key:"main", data:state, updated_at:new Date().toISOString() })
    });
    if(!w.ok) throw new Error("write "+w.status);
    localStorage.setItem("portal-config", JSON.stringify(state));
    renderAll(); toast(okMsg || "已儲存，老師區和學員區同步更新");
    return true;
  }catch(err){
    console.warn(err); alert("網路不穩，這次沒有存到，請再按一次確定"); return false;
  }
}
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id="toast";
    t.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2c2418;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;letter-spacing:.06em;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center;";
    document.body.appendChild(t); }
  t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(()=> t.style.display="none", 2600);
}
$("#e-submit").addEventListener("click", async ()=>{
  const type = $("#e-type").value;
  const e = { id: evTargetId || newId(), type, date:$("#e-date").value, end:$("#e-end").value, time:$("#e-time").value.trim(),
              title:$("#e-title").value.trim(), note:$("#e-note").value.trim(),
              course: type==="course" ? $("#e-course").value.trim() : "",
              to: type==="internal" ? {teacher:false,student:false} : {teacher:$("#e-to-teacher").checked, student:$("#e-to-student").checked} };
  if(!e.title && e.course) e.title = e.course;
  if(!e.date || !e.title){ alert("日期和活動名稱要填"); return; }
  if(e.end && e.end < e.date){ alert("結束日期不能比開始日期早"); return; }
  if(e.end === e.date) e.end = "";
  const btn = $("#e-submit"); btn.disabled = true; btn.textContent = "儲存中…";
  const ok = await commitEvents(list=>{ const i = list.findIndex(x=> x.id===e.id); if(i>=0) list[i] = e; else list.push(e); });
  btn.disabled = false; btn.textContent = "確定";
  if(ok){ const v = calView.admin; if(v){ const d=new Date(e.date+"T00:00"); v.y=d.getFullYear(); v.m=d.getMonth(); v.sel=e.date; } closeModal("ev-modal"); renderAll(); }
});
$("#e-del").addEventListener("click", async ()=>{
  const id = evTargetId; if(id===null || !confirm("刪除這個活動？")) return;
  const ok = await commitEvents(list=>{ const i = list.findIndex(x=> x.id===id); if(i>=0) list.splice(i,1); }, "已刪除");
  if(ok) closeModal("ev-modal");
});

// 每天換一句：從 2026/10/1 開始依序輪，台灣時間過午夜就換
function renderDaily(){
  const el = document.getElementById("daily-teacher"); if(!el) return;
  const now = new Date(Date.now() + 8*3600e3);                         // 台灣時間
  const day = Math.floor((Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) - Date.UTC(2026,9,1)) / 864e5);
  const it = DAILY[((day % DAILY.length) + DAILY.length) % DAILY.length];
  el.innerHTML = `<div class="daily-h"><span>今日一句</span><span class="kind">${esc(it.k)}</span><span class="dt">${now.getUTCMonth()+1}/${now.getUTCDate()}（${WD[now.getUTCDay()]}）</span></div>
    <div class="daily-q">${esc(it.q)}</div>
    <div class="daily-src">— ${esc(it.s)}</div>
    ${it.n ? `<div class="daily-note"><b>白話</b>${esc(it.n)}</div>` : ""}`;
}
function renderAll(){ renderDaily(); ensureAnn(); ensureCal(); if(calZone) renderCal(calZone); renderZone("admin","zone-admin"); renderZone("teacher","zone-teacher"); renderZone("student","zone-student"); renderBoard("admin"); renderBoard("teacher"); renderBoard("student"); }

let modalTarget = null; // {zoneKey, ci, ii|null}
function openItemModal(zoneKey, ci, ii){
  modalTarget = {zoneKey, ci, ii};
  const isNew = ii === null;
  const item = isNew ? {name:"",desc:"",type:"web",url:"",hint:""} : state[zoneKey][ci].items[ii];
  $("#item-modal-title").textContent = isNew ? "新增系統" : "編輯系統";
  $("#f-name").value = item.name||"";
  $("#f-desc").value = item.desc||"";
  $("#f-type").value = item.type||"web";
  $("#f-url").value = item.url||"";
  $("#f-hint").value = item.type==="gallery" ? (item.images||[]).map(m=>`${m.title||""}｜https://drive.google.com/file/d/${m.id}/view`).join("\n")
                     : item.type==="line" ? (item.lineId||"") : (item.hint||"");
  $("#f-tag").value = item.tag||"";
  syncTypeFields();
  $("#item-modal").classList.add("show");
}
function syncTypeFields(){
  const t = $("#f-type").value;
  $("#f-url-wrap").style.display  = (t==="web"||t==="gallery"||t==="line") ? "block":"none";
  $("#f-url-label").textContent   = t==="gallery" ? "雲端資料夾連結（可空白，備用）" : t==="line" ? "加好友連結（例：https://lin.ee/...）" : "網址";
  $("#f-hint-wrap").style.display = (t==="local"||t==="note"||t==="gallery"||t==="line") ? "block":"none";
  $("#f-hint-label").textContent  = t==="note" ? "內容（答案／說明，可多行）"
    : t==="gallery" ? "圖片（一行一張：名稱｜雲端圖片連結。新圖片在雲端按「共用→複製連結」貼過來）"
    : t==="line" ? "LINE ID（例：@792edykw）" : "開啟說明";
}
$("#f-type").addEventListener("change", syncTypeFields);
$("#f-submit").addEventListener("click", ()=>{
  const {zoneKey, ci, ii} = modalTarget;
  const type = $("#f-type").value;
  const item = {
    name: $("#f-name").value.trim() || "未命名",
    desc: $("#f-desc").value.trim(),
    type,
    url:  $("#f-url").value.trim(),
    hint: $("#f-hint").value.trim(),
  };
  const tag = $("#f-tag").value.trim(); if(tag) item.tag = tag;
  if(type==="gallery"){
    item.images = item.hint.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const parts = l.split(/[｜|]/); const link = parts.pop().trim(); const id = driveId(link);
      return id ? { title:(parts.join("｜").trim() || ""), id } : null;
    }).filter(Boolean);
    if(!item.images.length){ alert("圖片連結看不懂，請貼 Google 雲端的圖片連結（一行一張）"); return; }
    item.hint = "";
  }
  if(type==="line"){ item.lineId = item.hint; item.hint = ""; }
  if(ii===null) state[zoneKey][ci].items.push(item);
  else state[zoneKey][ci].items[ii] = item;
  closeModal("item-modal");
  renderAll();
});
function closeModal(id){ document.getElementById(id).classList.remove("show"); }

document.querySelectorAll(".add-cat").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const n = prompt("新分類名稱：");

});

/* ============================================================
   ⑦ 首頁 / 分區切換（純 JS，不動網址）
   老師專用網址：後面加 #teacher 或 ?v=t 直接進老師區
   ============================================================ */
const ZONES = ["admin","teacher","student"];
function show(zone){
  currentZone = ZONES.includes(zone) ? zone : null; setTimeout(()=> prefetchZone(currentZone), 50);
  $("#home").style.display = ZONES.includes(zone) ? "none" : "grid";
  ZONES.forEach(z=> document.getElementById("zone-"+z).classList.toggle("active", zone===z));
  window.scrollTo(0,0);
}
const ZONE_LABEL = { admin:"行政區", teacher:"老師區", student:"學員區" };
function enterZone(zone){
  const pw = ZONE_PASSWORDS[zone] || "";
  if(pw && localStorage.getItem("portal-unlock-"+zone) !== "1"){
    const input = prompt(`請輸入${ZONE_LABEL[zone]}密碼：`);
    if(input === null) return;
    if(input !== pw){ alert("密碼錯誤"); return; }
    localStorage.setItem("portal-unlock-"+zone, "1"); // 這台裝置記住，之後免輸入
  }
  show(zone);
}
document.querySelectorAll(".big-menu button").forEach(btn=> btn.addEventListener("click", ()=> enterZone(btn.dataset.zone)));
document.querySelectorAll(".back").forEach(btn=> btn.addEventListener("click", ()=> show(null)));
const q = new URLSearchParams(location.search);
const startZone =
  location.hash === "#teacher" || q.get("v")==="t" ? "teacher"
  : location.hash === "#student" || q.get("v")==="s" ? "student"
  : location.hash === "#admin" ? "admin" : null;
if(startZone) enterZone(startZone);

root.removeAttribute("data-theme");
root.style.colorScheme="light";

$("#btn-size").onclick = ()=>{
  const next = root.dataset.size==="large" ? "" : "large";
  root.dataset.size = next;
  localStorage.setItem("portal-size", next||"normal");

function syncToggles(){
  $("#btn-size").setAttribute("aria-pressed", root.dataset.size==="large" ? "true":"false");
}
["#btn-size"].forEach(id=> $(id).addEventListener("click", ()=> setTimeout(syncToggles)));
syncToggles();
loadConfig();
