<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>神奇身心靈學苑・學員專區（試用版）</title>
<style>

:root,body.t-blue{--pri:#1d3461;--pri2:#2c4b80;--pri-soft:#eaf0f8;--bg:#f3f5f9;--line:#e1e6ef;--ink:#1a2233;--quiet:#667085;--acc:#c6a15b;--acc-soft:#fbf6ea;--accd:#9a7631}
body.t-green{--pri:#1f4a3a;--pri2:#2f6a53;--pri-soft:#e8f1ec;--bg:#f2f5f3;--line:#dce6e0;--ink:#17241e;--quiet:#617068;--acc:#c6a15b;--acc-soft:#fbf6ea;--accd:#9a7631}
body.t-purple{--pri:#46395f;--pri2:#655285;--pri-soft:#efebf6;--bg:#f6f3f8;--line:#e6e0ee;--ink:#221c2e;--quiet:#6c6478;--acc:#c6a15b;--acc-soft:#fbf6ea;--accd:#9a7631}
:root{color-scheme:light only;--ok:#1d7a55;--ok-bg:#eaf6f0;--warn:#9a6a1c;--warn-bg:#fdf5e6;--bad:#9b4646;--bad-bg:#fbefef;--r:18px;--sh:0 2px 10px rgba(20,32,60,.05),0 10px 28px rgba(20,32,60,.04)}
@media (prefers-color-scheme:dark){:root{color-scheme:light only}}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.7;text-wrap:pretty;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;color:var(--ink);letter-spacing:.04em;line-height:1.45;text-wrap:balance}
h2{font-size:22px;margin:20px 0 12px} h3{font-size:18px;margin:0 0 10px} p{margin:8px 0}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom))}
.muted{color:var(--quiet);font-size:15px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.two>*,.three>*{min-width:0}
.demo{font-size:14px;color:var(--quiet);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:0 0 12px}
/* 頁首 */
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
header.top h1{font-size:21px;margin:0} header.top small{display:block;color:var(--quiet);font-size:14px;font-family:inherit;letter-spacing:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px}
.topbar b{font-family:"Noto Serif TC","Songti TC",serif;font-size:17px;color:var(--pri);letter-spacing:.06em;margin-right:8px}
.topbar span{color:var(--quiet);font-size:15px}
.lnk{border:0;background:none;color:var(--quiet);font-size:15px;padding:6px 2px}
.adm-head{display:flex;justify-content:space-between;align-items:center;background:var(--pri);color:#fff;border-radius:16px;padding:14px 18px;margin:0 0 14px;box-shadow:0 8px 22px rgba(20,32,60,.14)}
.adm-head b{font-family:"Noto Serif TC","Songti TC",serif;font-size:21px;letter-spacing:.1em}
.adm-head button{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:10px;padding:6px 14px;font-size:15px}
/* 卡片與按鈕 */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--sh);min-width:0;overflow-wrap:break-word}
.card.soft{background:var(--pri-soft);border-color:transparent;box-shadow:none}
.card.miss{border-color:var(--acc);background:var(--acc-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border:1px solid var(--pri);border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;line-height:1.35;text-align:center;max-width:100%}
.btn:active{filter:brightness(.92)}
.btn.line{background:#fff;color:var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--pri);border-color:var(--pri)}
.btn.block{display:flex;width:100%;margin-top:10px}
.btn.big{min-height:54px;font-size:18px;border-radius:999px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;border:0}
.c-ok{color:var(--ok);background:var(--ok-bg)} .c-warn{color:var(--warn);background:var(--warn-bg)} .c-bad{color:var(--bad);background:var(--bad-bg)} .c-blue{color:var(--pri);background:var(--pri-soft)} .c-gray{color:#5b6475;background:#eef0f4}
label.f{display:block;margin:14px 0 6px;font-size:15px;font-weight:600;color:var(--quiet)}
input.t,select.t,textarea.t{display:block;width:100%;min-height:48px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:16px}
input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--pri2);box-shadow:0 0 0 3px var(--pri-soft)}
textarea.t{min-height:100px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.seg button{flex:1 1 auto;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--quiet);font-size:15px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.seg.sub{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg.sub button{border:0;border-radius:10px;min-height:40px}
.seg.sub button.on{background:var(--pri-soft);color:var(--pri)}
.back{border:0;background:none;color:var(--pri);font-weight:700;font-size:16px;padding:4px 0;margin:0 0 6px}
.sess{border-top:1px solid var(--line);padding:12px 0 2px;margin-top:10px}
.sess:first-of-type{border-top:0;margin-top:0}
/* 學員：狀態列 */
.status{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 14px;box-shadow:var(--sh)}
.st-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.st-mid b{font-size:17px;font-family:"Noto Serif TC","Songti TC",serif}
.st-mid small{color:var(--quiet);font-size:13px}
.st-coin{display:flex;align-items:center;gap:5px;padding-left:12px;border-left:1px solid var(--line)}
.st-coin b{font-size:20px;color:var(--ink)}
.coinimg{width:30px;height:30px}
.coin{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.18em;margin-right:3px;background:url(img/coin.png) center/contain no-repeat}
.xp{height:8px;border-radius:99px;background:var(--pri-soft);overflow:hidden;margin-top:2px}
.xp span{display:block;height:100%;border-radius:99px;background:var(--lvc,var(--pri))}
/* 等級徽章 */
.lvbadge{position:relative;display:inline-flex;flex:none;width:52px;height:52px;border-radius:50%;padding:3px;background:#fff;border:2px solid var(--lvc,var(--pri))}
.lvbadge img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.lvbadge b{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;border-radius:99px;background:var(--lvc,var(--pri));color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.lvbadge.sm{width:38px;height:38px} .lvbadge.sm b{min-width:18px;height:18px;font-size:11px}
.lvbadge.xl{width:84px;height:84px;margin:0 auto}
.lv1,.lvb1{--lvc:#8a94a8}.lv2,.lvb2{--lvc:#2f8a62}.lv3,.lvb3{--lvc:#2f6fb5}.lv4,.lvb4{--lvc:#6a55b8}.lv5,.lvb5{--lvc:#b8892c}.lv6,.lvb6{--lvc:#8f4f9e}
.lvb6{border-color:#c6a15b;box-shadow:0 0 0 2px #8f4f9e}
.lvcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--lvc);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
.lv5.lvcard{background:linear-gradient(160deg,#fffaf0,#fff 60%)}
.lv6.lvcard{background:linear-gradient(160deg,#f8f1fb,#fffaf0 55%,#fff);border:2px solid #c6a15b;border-top-width:5px}
.coins{display:flex;align-items:center;gap:5px;font-size:22px;font-weight:800}
.lvrow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--lvc);border-radius:14px;padding:12px;margin:0 0 10px;background:#fff}
.lvrow.cur{background:var(--pri-soft)} .lvrow p{margin:4px 0 0}
.lvtag{font-size:13px;font-weight:700;padding:1px 8px;border-radius:99px;color:var(--lvc);background:#f0f2f6;margin-left:8px}
.lvt1{--lvc:#6f7a90}.lvt2{--lvc:#2f8a62}.lvt3{--lvc:#2f6fb5}.lvt4{--lvc:#6a55b8}.lvt5{--lvc:#9a7225}.lvt6{--lvc:#8f4f9e}
/* 學員：今天的課 */
.today{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;margin:0 0 14px;box-shadow:var(--sh);overflow:hidden}
.td-txt{padding-right:104px;min-height:96px}
.td-lab{display:flex;align-items:center;gap:6px;color:var(--pri);font-weight:700;font-size:15px}
.si{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.td-big{display:block;font-family:"Noto Serif TC","Songti TC",serif;font-size:28px;line-height:1.3;margin:6px 0 2px;color:var(--ink)}
.td-txt p{margin:0;color:var(--quiet)}
.td-img{position:absolute;top:14px;right:12px;width:96px;height:96px}
.td-done{margin-top:12px;text-align:center;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:12px;font-weight:700}
/* 學員：四格入口 */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 10px}
.tile{display:flex;align-items:center;gap:10px;width:100%;min-height:84px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 8px;text-align:left;box-shadow:var(--sh);min-width:0}
.tile .ill{width:56px;height:56px;flex:none}
.tile span{flex:1;min-width:0;display:flex;flex-direction:column}
.tile b{font-size:17px;font-family:"Noto Serif TC","Songti TC",serif}
.tile small{font-size:13px;color:var(--quiet);line-height:1.4}
.tile i{font-style:normal;color:var(--quiet);font-size:20px}
.tile.wide{margin:0 0 14px}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.sec-h b{font-family:"Noto Serif TC","Songti TC",serif;font-size:19px}
.sec-h.in{margin:0 0 6px} .sec-h .si{color:var(--pri)}
.sec-ill{width:34px;height:34px}
.news{padding:4px 14px}
.nrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 0}
.nrow:first-child{border-top:0}
.nrow span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.nrow small{color:var(--quiet);font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nrow i{font-style:normal;color:var(--quiet);font-size:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pri);flex:none}
.dot.rec{background:var(--acc)}
/* 主題顏色 */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px 4px}
.sw i{width:40px;height:40px;border-radius:50%}
.sw-blue i{background:#1d3461}.sw-green i{background:#1f4a3a}.sw-purple i{background:#46395f}
body.t-jade{--pri:#24804a;--pri2:#33995c;--pri-soft:#e6f4ec;--bg:#f2f7f4;--line:#d9e9df;--ink:#16261d;--quiet:#5f7268;--acc:#c6a15b;--acc-soft:#fbf6ea;--accd:#9a7631}
body.t-red{--pri:#b23a3a;--pri2:#c95454;--pri-soft:#f9e9e8;--bg:#faf4f3;--line:#efdcda;--ink:#2a1716;--quiet:#77605e;--acc:#c6a15b;--acc-soft:#fbf6ea;--accd:#9a7631}
body.t-amber{--pri:#b8860b;--pri2:#cc9a1f;--pri-soft:#faf0de;--bg:#fbf7ef;--line:#efe3cb;--ink:#2b210f;--quiet:#76694f;--acc:#b23a3a;--acc-soft:#f9e9e8;--accd:#8c2c2c}
body.t-gold{--pri:#c99a12;--pri2:#ddb12a;--pri-soft:#fbf3d9;--bg:#faf8f2;--line:#ece4d0;--ink:#2a2416;--quiet:#73694f;--acc:#8a6d2f;--acc-soft:#f6efdd;--accd:#6d5422}
body.t-rose{--pri:#c27c88;--pri2:#d4959f;--pri-soft:#f9eef0;--bg:#fbf6f7;--line:#f0e1e4;--ink:#2e1d21;--quiet:#7a6669;--acc:#c6a15b;--acc-soft:#fbf6ea;--accd:#9a7631}
body.t-ink{--pri:#22303f;--pri2:#3a4b5e;--pri-soft:#e8ecf1;--bg:#f4f5f7;--line:#dfe3e9;--ink:#141b24;--quiet:#626b77;--acc:#c6a15b;--acc-soft:#fbf6ea;--accd:#9a7631}
.sw-jade i{background:#24804a}.sw-red i{background:#b23a3a}.sw-amber i{background:#b8860b}.sw-gold i{background:linear-gradient(135deg,#f3d26b,#c99a12)}.sw-ink i{background:#22303f}.sw-rose i{background:#c27c88}
.sw span{text-align:center;font-size:13px;line-height:1.3}
.sw span em{display:block;font-style:normal;font-size:11px;color:var(--quiet)}
.sw.lock i{position:relative}.sw.lock i::after{content:"🔒";position:absolute;right:-6px;bottom:-4px;font-size:14px;background:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.gth{display:flex;align-items:center;justify-content:center;border-radius:14px}
.gth span{color:#fff;font-size:34px;font-weight:700;font-family:serif}
.sw.on{border-color:var(--pri);background:var(--pri-soft);font-weight:700}
/* 行政：今日 */
.today-h{margin:4px 2px 12px;font-size:24px}
.todos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:0 0 12px}
.todo{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 4px 10px;box-shadow:var(--sh);min-width:0}
.todo-ill{width:44px;height:44px;opacity:.55}
.todo b{position:absolute;top:8px;right:10px;min-width:24px;height:24px;border-radius:99px;background:#eef0f4;color:var(--quiet);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.todo span{font-size:14px;color:var(--quiet)}
.todo.has{border-color:var(--acc);background:var(--acc-soft)}
.todo.has .todo-ill{opacity:1} .todo.has b{background:var(--accd);color:#fff} .todo.has span{color:var(--ink);font-weight:600}
.alert{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--acc);background:var(--acc-soft);border-radius:14px;padding:12px 14px;margin:0 0 12px;flex-wrap:wrap}
.alert b{flex:1 1 100%;font-size:15px;color:var(--accd)} .alert span{flex:1;font-size:14px;color:var(--quiet)} .alert i{font-style:normal}
.ck-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ck-top>div:first-child{min-width:0;display:flex;flex-direction:column}
.ck-name{font-family:"Noto Serif TC","Songti TC",serif;font-size:26px;margin:4px 0 0;line-height:1.3}
.code{flex:none;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--pri-soft);border-radius:14px;padding:8px 14px;color:var(--pri)}
.code span{font-size:13px;font-weight:600}
.code b{font-size:32px;letter-spacing:3px;line-height:1.2;color:var(--ink);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 4px;border-top:1px solid var(--line);padding-top:10px}
.stat3 div{text-align:center;border-left:1px solid var(--line)} .stat3 div:first-child{border-left:0}
.stat3 span{display:block;font-size:14px;color:var(--quiet)}
.stat3 b{font-size:28px;color:var(--pri);font-family:"Noto Serif TC",serif} .stat3 b.g{color:var(--ok)} .stat3 b.w{color:var(--accd)}
.roster{list-style:none;margin:0;padding:0}
.roster li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:11px 0;flex-wrap:wrap}
.roster li:first-child{border-top:0}
.roster .nm{display:flex;align-items:center} .roster .nm b{font-size:17px;font-family:"Noto Serif TC","Songti TC",serif}
.roster .acts{display:flex;gap:6px;margin-left:auto}
/* 行政：更多 */
.menu{padding:2px 14px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 0}
.menu button:first-child{border-top:0}
.menu span{flex:1;display:flex;flex-direction:column} .menu b{font-size:17px} .menu small{color:var(--quiet);font-size:14px}
.menu i{font-style:normal;color:var(--quiet);font-size:20px}
.m-ill{width:40px;height:40px}
/* 商城 */
.goods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.good{display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--sh);min-width:0}
.good b{font-size:16px}
.good .btn{margin-top:auto;min-height:42px;font-size:15px;padding:8px}
.good .chip{align-self:flex-start;margin-top:auto}
.gimg{height:104px;border-radius:12px;background:var(--pri-soft);display:flex;align-items:center;justify-content:center}
.gimg img{width:80px;height:80px}
.gsm{display:inline-block;width:38px} .gsm .gimg{height:38px;border-radius:8px} .gsm .gimg img{width:30px;height:30px}
.gprice{font-weight:800;font-size:18px;color:var(--ink)}
/* 共用 */
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{border-top:1px solid var(--line);padding:10px 0}
.list-plain li:first-child{border-top:0}
.copybox{white-space:pre-wrap;background:var(--pri-soft);border-radius:12px;padding:14px;font-size:16px;overflow-wrap:anywhere}
.mask{position:fixed;inset:0;background:rgba(15,22,40,.42);display:none;align-items:flex-end;justify-content:center;z-index:100}
.mask.show{display:flex}
.sheet{background:#fff;width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:22px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;display:none;z-index:200;max-width:90%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:4px 4px env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(20,32,60,.05)}
nav.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:7px 0 8px;color:var(--quiet);font-size:13px}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--pri);font-weight:700}
nav.tabs button.on svg{stroke-width:2.2}
@media (min-width:720px){nav.tabs{justify-content:center} nav.tabs button{max-width:150px;font-size:14px} .goods{grid-template-columns:repeat(3,minmax(0,1fr))}}
#__kbSpacer{height:0}
.paylist{list-style:none;margin:0 0 10px;padding:0}
.paylist li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0}

function lLeapDays(y){return lLeapMonth(y)?((lunarInfo[y-1900]&0x10000)?30:29):0;}
function lMonthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function lYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+lLeapDays(y);}
/* 農曆 → 國曆（西元） */
function lunar2solar(ly,lm,ld,isLeap){
  ly=parseInt(ly); lm=parseInt(lm); ld=parseInt(ld);
  if(!(ly>=1900&&ly<=2100))return null;
  if(!(lm>=1&&lm<=12)||!(ld>=1&&ld<=30))return null;
  const leap=lLeapMonth(ly);
  if(isLeap&&leap!==lm) isLeap=false;
  if(isLeap? ld>lLeapDays(ly) : ld>lMonthDays(ly,lm)) return null;
  let off=0;
  for(let i=1900;i<ly;i++) off+=lYearDays(i);
  for(let i=1;i<lm;i++){ off+=lMonthDays(ly,i); if(leap>0&&i===leap) off+=lLeapDays(ly); }
  if(isLeap) off+=lMonthDays(ly,lm);
  off+=ld-1;
  const d=new Date(Date.UTC(1900,0,31)+off*86400000);
  return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()};
}
/* 民國農曆（年可為民國或西元，月可帶「閏」）→ 國曆西元 {y,m,d} */
function l2sWest(by,bm,bd){
  by=parseInt(by); bd=parseInt(bd);
  const ms=''+(bm==null?'':bm); const isLeap=ms.indexOf('閏')>=0;
  const mn=parseInt(ms.replace('閏',''));
  if(!by||!mn||!bd)return null;
  const ly = by>=1000 ? by : by+1911;
  return lunar2solar(ly,mn,bd,isLeap);
}

/* 生日、時間填完自動跳下一格 */
function advReady(kind,v){
  v=half(v); var n=+v; if(!/^\d+$/.test(v)) return false;
  if(kind==='y') return v.length>=4 || (v.length===3&&n>=100&&n<=130) || (v.length===2&&n>=10&&n!==19&&n!==20);
  if(kind==='m') return v.length>=2 || n>=2;
  if(kind==='d') return v.length>=2 || n>=4;
  if(kind==='h') return v.length>=2 || n>=3;
  if(kind==='mi') return v.length>=2;
  return false;
}
function bindAdv(){
  var list=[].slice.call(document.querySelectorAll('[data-adv]'));
  list.forEach(function(el,i){
    el.addEventListener('input',function(){
      if(!advReady(el.dataset.adv,el.value)) return;
      var nx=list[i+1];
      if(nx){ nx.focus(); try{ nx.select(); }catch(e){} }
      else if(el.dataset.adv==='d'){ var t=$('pSC'); if(t) t.focus(); else el.blur(); }
      else el.blur();
    });
  });
}
function solarOf(p){
  var y=+half(p.y), m=+half(p.m), d=+half(p.d); if(!y||!m||!d) return null;
  if(y<1000) y+=1911;
  if(p.cal==='農') return lunar2solar(y,m,d,!!p.leap);
  var dt=new Date(Date.UTC(y,m-1,d)); if(dt.getUTCMonth()!==m-1) return null; return {y:y,m:m,d:d};
}
function timeOf(p){
  if(p.timeMode==='clock'){ var h=half(p.hh), mi=half(p.mi); if(h==='') return null; return {h:+h, mi:+mi||0}; }
  if(p.timeMode==='sc'&&p.shichen!==''){ var i=+p.shichen; return {h:i===0?23:i*2, mi:0}; }
  return null;
}
function birthText(p){ var s=solarOf(p); var t=p.timeMode==='clock'?(half(p.hh)+':'+String(+half(p.mi)||0).padStart(2,'0')):p.timeMode==='sc'?('子丑寅卯辰巳午未申酉戌亥'[+p.shichen]+'時'):'時間不詳';
  return (p.cal==='農'?'農曆 '+p.y+'/'+(p.leap?'閏':'')+p.m+'/'+p.d+'（國曆 '+(s?s.y+'/'+s.m+'/'+s.d:'?')+'）':'國曆 '+(s?s.y+'/'+s.m+'/'+s.d:'?'))+'　'+t; }
function saveProfile(){
  grab(); var err=function(m){ var e=$('pErr'); e.textContent=m; e.style.display='block'; e.scrollIntoView({block:'center'}); };
  if(!PF.name.trim()) return err('請填姓名');
  if(!PF.sex) return err('請選性別');
  var s=solarOf(PF); if(!s) return err('生日看起來不對，請再確認年、月、日');
  if(s.y<1901||s.y>2099) return err('出生年要在 1901 到 2099 之間');
  if(PF.timeMode==='clock'){ var h=+half(PF.hh), mi=+half(PF.mi)||0; if(half(PF.hh)===''||h<0||h>23||mi<0||mi>59) return err('出生時間請填 0 到 23 點、0 到 59 分'); }
  if(PF.timeMode==='sc'&&PF.shichen==='') return err('請選時辰');
  var st=formStu(); st.profile=PF; st.name=PF.name.trim(); st.phone=PF.phone; st.email=PF.email; st.updatedAt=today(); PF=null; ME_SUB='chart';
  if(PFA){ PFA=null; ATAB='students'; save(); render(); toast('已代填 '+st.name+' 的資料'); return; }
  save(); render(); toast('已儲存，命盤排好了');
}

/* =====================================================================
   小金幣・經驗值・等級・商城（流程試用版）
   防洗規則：
   - 只有「簽到」給獎勵；報名、付款本身不給（避免報名→退款→再報名洗）
   - 每一筆報名只算一次（紀錄用 ci:報名編號 當鑰匙，重複不會再給；改期也不會重算）
   - 只能在上課當天簽到，而且要輸入現場簽到碼（只有在教室才看得到）
   - 簽到後不能退款，所以不會有「簽完領獎再退費」
   - 經驗值只會增加；兌換商品只扣金幣
   - 行政手動調整金幣一定要寫原因，全部留紀錄
   ===================================================================== */
var LV=[
  {n:1,name:'新生',need:0,badge:'🌱',perk:'開始累積：每次上課簽到 +10 小金幣、+10 經驗'},
  {n:2,name:'常客',need:30,badge:'🍃',perk:'名字旁出現徽章，首頁換成綠色主題'},
  {n:3,name:'學長姐',need:80,badge:'🌿',perk:'商城解鎖「學長姐限定」商品，主題換成天藍色'},
  {n:4,name:'資深學員',need:150,badge:'🌳',perk:'額滿時候補優先，主題換成紫色'},
  {n:5,name:'學苑之星',need:250,badge:'⭐',perk:'生日當月送 100 小金幣，解鎖一對一諮詢兌換，金色主題'},
  {n:6,name:'殿堂學員',need:400,badge:'👑',perk:'滿級：名字上學苑榮譽榜、每年一次免費旁聽、專屬金框'}
];
function ledgerOf(a){ return (S.ledger||[]).filter(function(x){return x.acct===a;}); }
function expOf(a){ return ledgerOf(a).reduce(function(t,x){return t+Math.max(0,x.exp||0);},0); }
function coinsOf(a){ return ledgerOf(a).reduce(function(t,x){return t+(x.coins||0);},0); }
function lvOf(a){ var e=expOf(a), r=LV[0]; LV.forEach(function(l){ if(e>=l.need) r=l; }); return r; }
function nextLv(l){ return LV[l.n]||null; }
/* 發獎勵：同一把鑰匙只會給一次 */
function award(a,key,coins,exp,why,by){
  S.ledger=S.ledger||[];
  if(S.ledger.some(function(x){return x.acct===a&&x.key===key;})) return false;
  S.ledger.push({id:'L'+Date.now()+Math.random().toString(36).slice(2,5),acct:a,key:key,coins:coins,exp:exp,why:why,date:today(),by:by||''});
  return true;
}
function monthCheckins(a,ym){ return ledgerOf(a).filter(function(x){return x.key.indexOf('ci:')===0&&x.date.slice(0,7)===ym;}).length; }
/* 簽到成功後：發獎勵＋檢查本月小目標，回傳是否升級 */
function rewardCheckin(e,by){
  var R=S.settings.reward, o=sessOf(e.session), before=lvOf(e.acct).n;
  var ok=award(e.acct,'ci:'+e.id,R.coins,R.exp,o.c.name+' 簽到',by);
  var ym=today().slice(0,7);
  if(ok&&monthCheckins(e.acct,ym)>=R.goal) award(e.acct,'mb:'+ym,R.bonus,0,'本月小目標達成（簽到 '+R.goal+' 次）',by);
  var after=lvOf(e.acct).n;
  return {ok:ok,up:after>before?LV[after-1]:null};
}
/* 簽到碼：每場、每天不同，只在行政「今日簽到」畫面看得到（正式版放在教室螢幕） */
function codeOf(sid){ var s=sid+today(), h=7; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%9000; return String(1000+h); }

function nowHM(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function doCheckin(eid){
  var e=S.enroll.find(function(x){return x.id===eid;}); var o=sessOf(e.session);
  if(e.status!=='paid'){ toast('這筆報名不能簽到'); closeSheet(); return; }
  if(!onDay(o.s)){ toast('只有上課當天可以簽到'); return; }
  if(half($('ckCode').value).trim()!==codeOf(e.session)){ toast('簽到碼不對，請看教室公布的號碼'); return; }
  e.status='checked'; e.checkedAt=today()+' '+nowHM(); e.checkedBy='學員';
  var r=rewardCheckin(e); save(); closeSheet(); render();
  if(r.up) upSheet(r.up); else toast(r.ok?'簽到完成 +'+S.settings.reward.coins+' 小金幣':'簽到完成');
}

function ordChip(o){ return o.status==='done'?'<span class="chip c-ok">已領取</span>':o.status==='cancel'?'<span class="chip c-gray">已取消・金幣退回</span>':'<span class="chip c-warn">'+(o.pickup==='寄送'?'待寄出':'待領取')+'</span>'; }
function askRedeem(id){
  var it=S.shop.find(function(x){return x.id===id;}), c=coinsOf(S.me);
  if(c<it.coins){ toast('小金幣還差 '+(it.coins-c)+'，多來上課就會有'); return; }
  var st=meStu();
  sheet('<h2>兌換 '+esc(it.name)+'</h2><p>'+esc(it.desc)+'</p><p style="font-size:19px;font-weight:700"><i class="coin"></i>'+it.coins+'</p><p class="muted">兌換後剩 '+(c-it.coins)+' 小金幣。</p>'+

       :'<p class="muted">領取方式：'+esc(it.pickup)+'</p>')+
    '<button class="btn block" onclick="doRedeem(\''+id+'\')">確認兌換</button><button class="btn gray block" onclick="closeSheet()">取消</button>');

function doRedeem(id){
  var it=S.shop.find(function(x){return x.id===id;}), c=coinsOf(S.me);
  if(c<it.coins||it.stock<=0) { toast('不能兌換'); closeSheet(); return; }
  var addr=''; if(it.pickup==='寄送'){ addr=($('rN').value+' '+$('rP').value+' '+$('rA').value).trim(); if(!$('rA').value.trim()){ toast('請填地址'); return; } }
  var oid='o'+Date.now(); it.stock--;
  S.orders.push({id:oid,acct:S.me,item:id,itemName:it.name,coins:it.coins,date:today(),status:it.pickup==='自動發放'?'done':'wait',pickup:it.pickup,addr:addr});
  award(S.me,'od:'+oid,-it.coins,0,'兌換 '+it.name);
  save(); closeSheet(); SHOP_SUB='orders'; render(); toast('兌換成功');
}

(function(){
  var vv=window.visualViewport, isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  function kbH(){ return vv?Math.max(0,innerHeight-vv.height):0; }
  function center(el){
    if(!isTouch&&kbH()<=120) return;
    var lab=el.previousElementSibling&&el.previousElementSibling.tagName==='LABEL'?el.previousElementSibling:null;
    var top=(lab||el).getBoundingClientRect().top, bot=el.getBoundingClientRect().bottom;
    var visH=vv?vv.height:innerHeight, mid=(top+bot)/2, need=mid-visH/2, maxScroll=document.documentElement.scrollHeight-innerHeight;
    if(need>0&&scrollY+need>maxScroll){ $('__kbSpacer').style.height=Math.min(2000,scrollY+need-maxScroll+20)+'px'; }
    var sc=el.closest('.sheet'); if(sc){ sc.scrollTop+=need; return; }
    window.scrollTo(0,scrollY+need);
  }
  document.addEventListener('focusin',function(e){ var t=e.target; if(!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return; setTimeout(function(){center(t);},300); });
  document.addEventListener('focusout',function(){ setTimeout(function(){ var a=document.activeElement; if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) $('__kbSpacer').style.height='0'; },200); });
})();

/* ---------- 學員系統・行政後台：學員分類查詢、課程管理分段 ---------- */
function cSubj(c){ return /^八字/.test(c.name)?'bazi':/^塔羅/.test(c.name)?'tarot':'other'; }
function cLv(c){ return /體驗/.test(c.name)?'try':/初階/.test(c.name)?'basic':/進階|高階/.test(c.name)?'adv':'other'; }
var SUBJ={bazi:'八字',tarot:'塔羅',other:'其他'}, LVN={try:'體驗',basic:'初階',adv:'進階'};
var SF={q:'',subj:'all',lv:'all',m:'all',fill:'all'};
function stuEnrolls(a){ return S.enroll.filter(function(e){ return e.acct===a&&e.status!=='refunded'; }).map(function(e){ return {e:e,c:course(e.course)}; }).filter(function(x){return x.c;}); }
function stuMatch(s){
  var q=SF.q.trim().toLowerCase();
  if(q && [s.name,s.acct,s.phone,s.referrer,s.second,s.note].join(' ').toLowerCase().indexOf(q)<0) return false;
  if(SF.fill==='no'&&s.profile) return false;
  var en=stuEnrolls(s.acct);
  if(SF.subj!=='all'||SF.lv!=='all'||SF.m!=='all'){
    en=en.filter(function(x){ var mon=(x.e.paidAt||'').slice(0,7)||(sessOf(x.e.session)||{s:{}}).s.date?.slice(0,7);
      return (SF.subj==='all'||cSubj(x.c)===SF.subj)&&(SF.lv==='all'||cLv(x.c)===SF.lv)&&(SF.m==='all'||mon===SF.m); });
    if(!en.length) return false;
  }
  return true;
}
function sfSet(k,v){ SF[k]=v; if(k==='subj') SF.lv='all'; render(); }
function aStudents(){
  var months={}; S.enroll.forEach(function(e){ if(e.paidAt) months[e.paidAt.slice(0,7)]=1; });
  var ms=Object.keys(months).sort().reverse();

    '<div class="seg" style="margin-top:10px">'+[['all','全部學員'],['bazi','八字學員'],['tarot','塔羅學員']].map(function(x){return '<button class="'+(SF.subj===x[0]?'on':'')+'" onclick="sfSet(\'subj\',\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div>';
  if(SF.subj!=='all') h+='<div class="seg sub">'+[['all','全部'],['try','體驗'],['basic','初階'],['adv','進階']].map(function(x){return '<button class="'+(SF.lv===x[0]?'on':'')+'" onclick="sfSet(\'lv\',\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div>';
  h+='<div class="two"><select class="t" onchange="sfSet(\'m\',this.value)"><option value="all">全部報名月份</option>'+ms.map(function(m){return '<option value="'+m+'" '+(SF.m===m?'selected':'')+'>'+(+m.slice(0,4))+' 年 '+(+m.slice(5))+' 月報名</option>';}).join('')+'</select>'+
    '<select class="t" onchange="sfSet(\'fill\',this.value)"><option value="all" '+(SF.fill==='all'?'selected':'')+'>資料：全部</option><option value="no" '+(SF.fill==='no'?'selected':'')+'>只看資料未填</option></select></div>'+

      '<div class="muted stu-meta">'+'<span class="nw">'+esc(s.phone||'')+'</span>・<span class="nw">推薦人 '+esc(s.referrer)+(s.second?'＋'+esc(s.second):'')+'</span>'+'・<span class="nw">建檔 '+esc((s.createdAt||'').slice(5).replace('-','/'))+'</span></div>'+

/* ---------- 學員：課表、我的課、聯絡我們（字級分層更清楚） ---------- */
var TF='all';
function dateBlock(s){ var d=new Date(s.date+'T12:00:00'); return '<div class="dblk"><b>'+d.getDate()+'</b><span>'+(d.getMonth()+1)+' 月</span><span>週'+'日一二三四五六'[d.getDay()]+'</span></div>'; }
function subjTag(c){ var k=c.price>0?cSubj(c):'free'; return '<span class="stag st-'+k+'">'+(k==='bazi'?'八字':k==='tarot'?'塔羅':'免費')+'</span>'; }
function sessCard(x,mine){
  var n=left(x.s), past=(x.s.end||x.s.date)<today();
  var tag= past?'<span class="chip c-gray">已結束</span>': mine?'<span class="chip c-ok">'+(mine.status==='wait'?'候補中':'已報名')+'</span>': n>0?'<span class="chip c-blue">剩 '+n+' 位</span>':'<span class="chip c-warn">額滿</span>';
  return '<button class="scard" onclick="openCourse(\''+x.c.id+'\')">'+dateBlock(x.s)+'<span class="sc-body"><span class="sc-top">'+subjTag(x.c)+tag+'</span><b class="sc-name">'+esc(x.c.name)+'</b><span class="sc-time">'+(x.s.end&&x.s.end!==x.s.date?sdate(x.s)+'　':'')+esc(x.s.time)+'</span><span class="sc-sub">'+esc(x.s.note||x.c.teacher)+'</span></span></button>';
}
function sessRow(x){ var mine=S.enroll.find(function(e){return e.acct===S.me&&e.session===x.s.id&&e.status!=='refunded';}); return sessCard(x,mine); }
function viewTable(){
  var h=head()+'<div class="pg-h"><h2>課表</h2></div><div class="seg sub">'+[['all','全部'],['bazi','八字'],['tarot','塔羅'],['free','免費課']].map(function(x){return '<button class="'+(TF===x[0]?'on':'')+'" onclick="TF=\''+x[0]+'\';render()">'+x[1]+'</button>';}).join('')+'</div>';
  var last='', any=false;
  allSess().filter(function(x){ return (x.s.end||x.s.date)>=today(); }).filter(function(x){
    return TF==='all'||(TF==='free'?!(x.c.price>0):(x.c.price>0&&cSubj(x.c)===TF)); }).forEach(function(x){
    var ym=x.s.date.slice(0,7); if(ym!==last){ last=ym; h+='<div class="grp"><span>'+(+ym.slice(5))+' 月</span></div>'; }
    h+=sessRow(x); any=true;
  });
  if(!any) h+='<div class="card soft">這個分類目前沒有排課。</div>';
  $('root').innerHTML=h;
}
function viewMine(){
  var h=head()+'<div class="pg-h"><h2>我的課</h2></div>';
  var list=S.enroll.filter(function(e){return e.acct===S.me;}).map(function(e){return {e:e,o:sessOf(e.session)};}).filter(function(x){return x.o;});
  var upc=list.filter(function(x){return (x.o.s.end||x.o.s.date)>=today()&&x.e.status!=='refunded';}).sort(function(a,b){return a.o.s.date<b.o.s.date?-1:1;});
  var done=list.filter(function(x){return upc.indexOf(x)<0;});

/* ---------- 登入安全（試用版也照正式規則做）----------
   - 學員和行政用同一個登入頁；行政帳號登入就進後台，頁面上不顯示行政帳號

LUCKY.forEach(function(x){ THEMES.push([x[0],x[1]+'・'+x[2]]); });
var FREE_THEMES=['blue','green','purple'];
function themeItems(){ return LUCKY.map(function(x){ return {id:'th-'+x[0],name:x[1]+'幸運色',coins:30,stock:999,desc:'五行屬'+x[2]+'的幸運色。兌換後整個學員專區換成'+x[1]+'，到「我的 → 資料與顏色」可以隨時切換。',pickup:'自動發放',minLv:1,icon:'🎨',on:true,theme:x[0]}; }); }
BASE.shop=BASE.shop.filter(function(i){return !i.theme;}).concat(themeItems());
function ownTheme(t){ if(FREE_THEMES.indexOf(t)>=0||S.admin) return true;
  return (S.orders||[]).some(function(o){ return o.acct===S.me&&o.status!=='refunded'&&(o.item==='th-'+t||((S.shop||[]).find(function(i){return i.id===o.item;})||{}).theme===t); }); }
var _setTheme0=setTheme;
setTheme=function(t){ if(!ownTheme(t)){ var it=(S.shop||[]).find(function(i){return i.theme===t&&i.on!==false;});
    if(it){ SHOP_SUB='items'; go('shop'); setTimeout(function(){ var el=document.querySelector('[data-th="'+t+'"]'); if(el) el.scrollIntoView({block:'center'}); },60); toast('這個幸運色要到商城用小金幣換'); } else toast('這個顏色還沒開放');
    return; }
  _setTheme0(t); };
(function(){ var t=THEME; if(FREE_THEMES.indexOf(t)<0){ /* 開機時還不知道買了沒，先套用，載入後再檢查 */ } })();
var _viewMeTh=viewMe;
viewMe=function(){ _viewMeTh();
  var box=document.querySelector('#root .themes'); if(!box) return;
  box.querySelectorAll('.sw').forEach(function(b){ var m=(b.className.match(/sw-(\w+)/)||[])[1]; if(m&&!ownTheme(m)){ b.classList.add('lock'); b.querySelector('span').insertAdjacentHTML('beforeend','<em>商城換</em>'); } });
  var h=box.previousElementSibling; if(h&&!document.querySelector('.th-note')) box.insertAdjacentHTML('afterend','<p class="muted th-note" style="margin:10px 0 0">五行幸運色可以到「商城」用小金幣換，換到就能用。</p>');
};
var _doRedeemTh=doRedeem;
doRedeem=function(id){ var it=(S.shop||[]).find(function(x){return x.id===id;});
  if(!it||!it.theme) return _doRedeemTh(id);
  rpc('st_redeem',{p_token:TOKEN,p_item:id,p_addr:''}).then(function(r){
    if(!r||!r.ok){ var m=(r&&r.msg)||errMsg(r); toast(m==='COINS'?'小金幣不夠':m==='STOCK'?'已經換完了':m==='LEVEL'?'等級還不夠':m); return; }
    closeSheet(); reload().then(function(){ _setTheme0(it.theme); toast('換好了！已經套用'+it.name); });
  }); };
var _goodImgTh=goodImg;
goodImg=function(it){ if(!it.theme) return _goodImgTh(it); var x=LUCKY.find(function(l){return l[0]===it.theme;})||['','','','#888'];
  return '<div class="gimg gth" data-th="'+it.theme+'" style="background:'+x[3]+'"><span>'+x[2]+'</span></div>'; };
var _viewShopTh=viewShop;
viewShop=function(){ _viewShopTh(); if(SHOP_SUB!=='items') return;
  document.querySelectorAll('#root .gth').forEach(function(g){ var t=g.getAttribute('data-th'); if(!ownTheme(t)) return;
    var card=g.closest('.good'); var b=card&&card.querySelector('.btn,.chip'); if(b) b.outerHTML=(THEME===t?'<span class="chip c-ok">使用中</span>':'<button class="btn line" onclick="setTheme(\''+t+'\')">已擁有・套用</button>'); }); };
/* 開機時記住的顏色如果沒買（例如換了手機帳號），載入資料後退回海軍藍 */
var _applyTh=apply;
apply=function(d){ _applyTh(d); if(!ownTheme(THEME)){ THEME='blue'; try{ localStorage.setItem('course_theme','blue'); }catch(e){} applyTheme(); } };

</script>
</body>
</html>
