<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#fbf8f1">
<title>業績總覽｜靈應壇 × 神奇身心靈學苑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  --ivory:#fbf8f1;--paper:#fffdf8;--ink:#2b2418;--sub:#86796a;--faint:#b3a690;--line:#ebe2cf;
  --gold:#b08d47;--gold-d:#7d5f26;--gold-l:#e9d6a0;
  --foil:linear-gradient(100deg,#7a5b22 0%,#b8913f 24%,#ecd58f 46%,#c29a45 64%,#7a5b22 100%);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --num:"Cormorant Garamond","Noto Serif TC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --main:#b3862a;--dark:#6f500f;--glow:#f6dc98;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100svh;overflow-x:hidden;color:var(--ink);font:15px/1.65 var(--sans);
  text-wrap:pretty;font-variant-numeric:lining-nums;
  background:
   radial-gradient(120% 60% at 50% -10%,rgba(236,213,143,.38),transparent 60%),
   radial-gradient(80% 50% at 110% 110%,rgba(236,213,143,.22),transparent 60%),
   var(--ivory);}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3,p{margin:0}
.nowrap{white-space:nowrap}
.foil{background:var(--foil);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:foil 8s ease-in-out infinite}
@keyframes foil{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.num{font-family:var(--num);font-weight:600;font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em;white-space:nowrap}

/* 細金線邊框（全站統一的「帖」） */
.pane{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 20px;
  box-shadow:0 1px 0 #fff inset,0 18px 36px -26px rgba(110,80,25,.45)}
.pane::before{content:"";position:absolute;inset:4px;border:1px solid rgba(176,141,71,.28);border-radius:14px;pointer-events:none}
.pane::after{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4.5px;transform:rotate(45deg);
  background:var(--paper);border:1px solid var(--gold);pointer-events:none}
.pane+.pane,.gap{margin-top:16px}
.pane-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.pane-h h2{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.pane-h small{color:var(--faint);font-size:12px;white-space:nowrap}

/* ===================== 登入 ===================== */
.login{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));max-width:440px;margin:0 auto}
.login-head{text-align:center;margin-bottom:22px}
.crest{width:54px;height:54px;margin:0 auto 10px;display:block}
.login-head .org{font-family:var(--serif);font-size:13px;letter-spacing:.24em;color:var(--sub);white-space:nowrap}
.login-head h1{font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:.2em;margin:4px 0 0 .2em;line-height:1.3}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;color:var(--gold)}
.rule::before,.rule::after{content:"";width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{transform:scaleX(-1)}
.rule i{width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--gold)}
.login .pane{padding:26px 22px 22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;letter-spacing:.08em;color:#5d4d33;margin:0 2px 7px}
.inbox{position:relative}
.inbox svg{position:absolute;left:15px;top:50%;width:19px;height:19px;margin-top:-9.5px;color:#b19d78;pointer-events:none}
.inbox input{display:block;width:100%;height:54px;border:1px solid #e3d8c0;border-radius:13px;background:#fffefb;
  padding:0 50px 0 46px;font-size:17px;outline:none;transition:border-color .2s,box-shadow .2s}
.inbox input::placeholder{color:#b9ad97}
.inbox input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(176,141,71,.14)}
#pw{-webkit-text-security:disc}
.eye{position:absolute;right:5px;top:5px;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#a8957a}
.eye svg{position:static;margin:0;width:20px;height:20px}
.err{display:none;align-items:center;gap:8px;margin:2px 0 12px;padding:10px 12px;border-radius:11px;background:#fdf1ee;border:1px solid #f1d2ca;color:#a8473b;font-size:14px}
.err.on{display:flex}
.err svg{width:17px;height:17px;flex:none}
.btn-gold{position:relative;overflow:hidden;width:100%;height:54px;border-radius:14px;font-size:17px;font-weight:700;letter-spacing:.24em;
  color:#2c1d05;background:linear-gradient(100deg,#c39b4c,#e8cf8a 45%,#f6e7b8 55%,#d1ac5c);border:1px solid #a5823e;
  box-shadow:0 10px 22px -10px rgba(140,100,35,.7),inset 0 1px 0 rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-gold::after{content:"";position:absolute;top:0;bottom:0;left:-70px;width:50px;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-70px}100%{left:110%}}
.btn-gold:active{transform:scale(.985)}
.btn-gold:disabled{opacity:.7}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(44,29,5,.25);border-top-color:#2c1d05;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.login-foot{text-align:center;color:var(--faint);font-size:12px;margin-top:16px;letter-spacing:.06em}

/* ===================== 登入後 ===================== */
.app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 14px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .crest{width:38px;height:38px;margin:0;flex:none}
.who b{display:block;font-family:var(--serif);font-size:17px;letter-spacing:.12em;white-space:nowrap}
.who span{display:block;font-size:12px;color:var(--sub);white-space:nowrap}
.ghost{min-height:44px;padding:0 14px;border-radius:12px;color:var(--sub);font-size:14px;white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.6)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:#efe8da;margin-bottom:16px}
.seg button{height:42px;border-radius:11px;font-size:15px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--gold-d);font-weight:700;box-shadow:0 2px 8px -3px rgba(110,80,25,.35),inset 0 0 0 1px var(--gold-l)}

/* 會員卡 */
.card{position:relative;overflow:hidden;border-radius:22px;padding:20px 22px 18px;color:#fff;
  background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(135deg,var(--main),var(--dark));
  box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 22px 36px -20px var(--dark)}
.card::before{content:"";position:absolute;inset:7px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);border-radius:16px;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.3) 48%,transparent 60%);transform:translateX(-120%);animation:sheen 1.8s .3s ease-out forwards;pointer-events:none}
@keyframes sheen{to{transform:translateX(120%)}}
.card svg.g{position:absolute;right:-60px;top:-70px;width:300px;height:300px;opacity:.28;pointer-events:none}
.card>*{position:relative}
.c1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c-tag{font-family:var(--serif);font-size:12px;letter-spacing:.4em;color:var(--glow)}
.c-rank{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:.16em;white-space:nowrap}
.c-emb{width:50px;height:50px;color:var(--glow);flex:none}
.c-name{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.2em;margin:12px 0 10px;white-space:nowrap}
.c-lab{font-size:12px;letter-spacing:.14em;color:var(--glow)}
.c-cum{font-size:34px;line-height:1.1}
.c-cum small{font-family:var(--sans);font-size:13px;font-weight:500;margin-right:6px;letter-spacing:.06em}
.c-prog{margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--glow) 40%,transparent)}
.c-bar{height:5px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.c-bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--glow),#fff);transition:width 1.2s .4s cubic-bezier(.2,.7,.2,1)}
.c-note{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:13px;color:color-mix(in srgb,#fff 88%,var(--glow))}
.c-note b{font-weight:600}

/* 月份 */
.month{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px}
.mb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--gold-d);box-shadow:0 4px 12px -8px rgba(110,80,25,.6)}
.mb:disabled{opacity:.3;box-shadow:none}
.mb svg{width:18px;height:18px}
.mtext{text-align:center}
.mtext .num{font-size:28px;color:var(--gold-d);line-height:1.1}
.mtext small{display:block;font-size:12px;color:var(--faint)}

/* 本月 */
.kpi-lab{font-size:14px;color:var(--sub);letter-spacing:.08em}
.kpi{font-size:50px;line-height:1.05;margin-top:2px}
.kpi small{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--gold);margin-right:8px;-webkit-text-fill-color:var(--gold)}
.duo{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.duo>div+div{padding-left:16px;border-left:1px solid var(--line)}
.duo .k{font-size:13px;color:var(--sub)}
.duo .v{font-size:27px;color:var(--ink);line-height:1.25}
.duo .h{font-size:12px;color:var(--faint)}
.warn{display:flex;gap:9px;align-items:flex-start;margin-bottom:14px;padding:11px 13px;border-radius:12px;background:#fcf4df;border:1px solid #ecd9a2;color:#7a5a16;font-size:14px}
.warn svg{width:18px;height:18px;flex:none;margin-top:2px}

/* 列表 */
.row{padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:2px}
.row .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row .nm{font-weight:600;white-space:nowrap}
.row .nm small{font-weight:400;color:var(--faint);font-size:13px;margin-left:6px}
.row .num{font-size:20px}
.bar{height:4px;border-radius:9px;background:#f0e9db;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#b08d47,#e7cf8b)}
.person{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0;padding-top:2px}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:#fff;font-size:17px;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--gold-l)}
.person .mid{flex:1;min-width:0}
.person .mid b{display:block;font-weight:600;white-space:nowrap}
.person .mid span{display:block;font-size:13px;color:var(--sub);white-space:nowrap}
.person .num{font-size:20px}
.empty{text-align:center;padding:18px 0 8px;color:var(--sub)}
.empty b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:4px}

/* 全公司 */
.total .num{font-size:46px;line-height:1.05}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:16px}
.pod{text-align:center;border-radius:16px;padding:14px 4px 12px;background:linear-gradient(180deg,#fffdf8,#f7efdd);border:1px solid var(--line)}
.pod.p1{padding-top:20px;background:linear-gradient(180deg,#fffaf0,#f3e3b6);border-color:#e2c983}
.medal{width:40px;height:40px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:20px;color:#fff;box-shadow:0 0 0 3px #fff,0 6px 12px -6px rgba(0,0,0,.4)}
.m1{background:linear-gradient(135deg,#f6dd8d,#b88a2c)}.m2{background:linear-gradient(135deg,#e8ecf1,#8b96a5)}.m3{background:linear-gradient(135deg,#efc8a2,#a5673a)}
.pod b{display:block;font-family:var(--serif);font-size:15px;white-space:nowrap}
.pod span{display:block;font-size:12px;color:var(--sub);white-space:nowrap}
.pod .num{display:block;font-size:19px;margin-top:4px;color:var(--gold-d)}
.ord{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-size:16px;font-weight:700;color:var(--sub);background:#f2ebdd}

/* 狀態 */
.foot{text-align:center;color:var(--faint);font-size:13px;margin-top:22px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3f9a6b;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(63,154,107,.15)}
.dot.off{background:#c0574b;box-shadow:0 0 0 3px rgba(192,87,75,.15)}
.net{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 12px;border-radius:12px;background:#fdf1ee;border:1px solid #f1d2ca;color:#a8473b;font-size:14px}
.net span{flex:1}
.net button{min-height:40px;padding:0 14px;border-radius:10px;background:#fff;border:1px solid #e9c3b9;color:#a8473b;font-weight:600;white-space:nowrap}
.sk{border-radius:18px;background:linear-gradient(90deg,#efe8da,#f8f4ec,#efe8da);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;max-width:calc(100% - 32px);
  padding:11px 18px;border-radius:12px;background:#2b2418;color:#f6e7b8;font-size:14px;box-shadow:0 12px 26px -10px rgba(0,0,0,.5);white-space:nowrap;transition:opacity .3s}
.fade{animation:fade .45s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:359px){.kpi{font-size:42px}.c-cum{font-size:30px}.duo .v{font-size:23px}.pod b{font-size:14px}.pod .num{font-size:17px}}
.grid2>div+div{margin-top:16px}
@media (min-width:900px){.grid2>div+div{margin-top:0}.app{max-width:960px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.grid2 .pane+.pane{margin-top:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ 驚艷層：香檳絲綢底、金粉、依品階變色、立體卡 ============ */
:root{--tint:#e8cf98;--tint2:#f3dfb0}
html{background:#f1dcae}
body{background:transparent}
#termbg{position:fixed;inset:0;z-index:-2;background:var(--termfall) center top/cover no-repeat;transition:opacity .6s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(251,246,234,.18) 0%,rgba(251,246,234,.42) 38%,rgba(248,240,222,.72) 100%)}
.when{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#5d4a26;letter-spacing:.06em;white-space:nowrap}
.when .term{font-family:var(--serif);font-weight:700;font-size:15px;color:#3f2c0d;padding:2px 12px;border-radius:999px;background:rgba(255,251,240,.82);border:1px solid #e3cd98}
.when .clock{font-family:var(--num);font-size:17px;font-weight:700;color:#3f2c0d}
.login .when{margin-bottom:18px}
.app .when{justify-content:flex-start;margin:-4px 2px 14px}
.login-foot{color:#6b5530}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
.pane{background:linear-gradient(180deg,#fffdf7,#fff8ea);border-color:#e3cd98;box-shadow:0 1px 0 #fff inset,0 22px 40px -24px rgba(120,80,15,.55)}
.pane::before{border-color:rgba(176,141,71,.45)}
.pane-h h2,.kpi-lab{color:#6b4c14}
.login .pane{box-shadow:0 1px 0 #fff inset,0 30px 60px -28px rgba(120,80,15,.7)}
.login-head .org{color:#7d6232}
.login-head h1{font-size:40px;filter:drop-shadow(0 2px 0 rgba(255,255,255,.8)) drop-shadow(0 8px 18px rgba(150,105,30,.35))}
.crest{filter:drop-shadow(0 8px 16px rgba(140,95,20,.35))}
.login-head .crest{width:64px;height:64px;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.login-foot{color:#8c7448}
.seg{background:rgba(255,250,236,.55);border:1px solid #e3cd98}
.ghost{background:rgba(255,252,242,.75);border-color:#e3cd98;color:#6b4c14}
.mb{border-color:#e3cd98}
.mtext small,.pane-h small,.foot{color:#9a8156}
/* 立體會員卡 */
.cardwrap{perspective:900px}
.card{transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.card .holo{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:soft-light;opacity:.75;
  background:radial-gradient(60% 70% at var(--hx,30%) var(--hy,20%),rgba(255,255,255,.75),transparent 60%),
  linear-gradient(115deg,transparent 20%,rgba(255,220,240,.35) 35%,rgba(200,240,255,.35) 50%,rgba(255,245,200,.35) 65%,transparent 80%);
  background-size:100% 100%,220% 220%;background-position:0 0,var(--hp,50%) 50%}
/* 開卡儀式 */
.rite{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,rgba(255,246,214,.98),rgba(244,222,166,.97) 60%,rgba(232,200,130,.97));animation:riteOut .5s 1.25s ease-in forwards}
.rite .crest{width:96px;height:96px;animation:riteCrest 1.2s cubic-bezier(.2,.8,.2,1) both}
.rite .ring{position:absolute;left:50%;top:45%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid #c9a352;animation:ring 1.2s .25s ease-out both}
.rite .ring.b{animation-delay:.45s}
.rite p{position:absolute;top:calc(45% + 70px);left:0;right:0;text-align:center;font-family:var(--serif);font-size:18px;letter-spacing:.4em;color:#7a5b22;animation:fade .6s .35s both}
@keyframes riteCrest{from{transform:scale(.4) rotate(-90deg);opacity:0}60%{transform:scale(1.12) rotate(8deg);opacity:1}to{transform:scale(1) rotate(0)}}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(4.2);opacity:0}}
@keyframes riteOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#dust{display:none}}

/* ============ 反差色層：朱紅、靛青、寶石色 ============ */
:root{--vermil:#b8291f;--vermil-d:#7e140e;--indigo:#16314f;--indigo-d:#0a1a2c}
/* 朱紅漆按鈕 */
.btn-gold{color:#f8e2a2;background:linear-gradient(180deg,#d0432f 0%,#a8241a 55%,#821710 100%);border:1px solid #6b120c;
  box-shadow:0 0 0 1px rgba(246,220,152,.55) inset,0 0 0 3px rgba(130,23,16,.0),0 14px 26px -12px rgba(130,23,16,.75);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn-gold::before{content:"";position:absolute;inset:4px;border:1px solid rgba(246,220,152,.55);border-radius:10px;pointer-events:none}
.spin{border-color:rgba(248,226,162,.3);border-top-color:#f8e2a2}

.row[style] .bar i{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 45%,#fff))}

async function api(body){
  if(!API_URL)return demo(body);
  const q=new URLSearchParams();
  if(body.action==='perfLogout')return {ok:true};
  if(body.action==='perfLogin'){q.set('action','login');q.set('name',body.name);q.set('pw',body.pw);}
  else{q.set('action',body.action);q.set('token',body.token||'');if(body.month)q.set('month',body.month);}
  const r=await fetch(API_URL+'?'+q.toString(),{method:'GET'});const d=await r.json();
  if(body.action==='perfLogin'){
    if(!d||d.ok===false)return {ok:false,err:(d&&d.error)||'帳號或密碼不對'};
    if(!d.pass)return {ok:false,err:'帳號或密碼不對'};
    return {ok:true,token:d.token,name:d.name||body.name,role:d.admin?'管理':'老師'};
  }
  if(d&&d.needLogin)return {ok:false,relogin:true};
  return d;
}

/* 客戶：已報／未報／建議聯繫 */
function custAdvice(list,month){
  const prev=shift(month,-1),mm=+month.split('.')[1],idle=shift(month,-3);
  const done=[],todo=[];
  list.forEach(c=>{const ms=c.months||[];(ms.includes(month)?done:todo).push(c);});
  const tagged=todo.map(c=>{const ms=c.months||[],last=c.last||ms.slice().sort().pop()||'';let why=[],score=0;
    if(ms.includes(prev)){why.push('上個月有報');score+=50;}
    if(+c.bm===mm){why.push('本月生日');score+=40;}
    if(c.vip){why.push('常客');score+=30;}
    if((+c.times||ms.length)>=3){score+=10;}
    if(last&&last<=idle){why.push('很久沒來');score+=15;}
    return {...c,last,why,score};}).sort((a,b)=>b.score-a.score);
  return {done,todo:tagged,suggest:tagged.filter(c=>c.why.length).slice(0,6)};
}

function addM(m,k){return shift(m,k);}
const CNY={2024:'02-10',2025:'01-29',2026:'02-17',2027:'02-06',2028:'01-26',2029:'02-13',2030:'02-03',2031:'01-23',2032:'02-11'};
/* 年斗：到下一個農曆過年的前一天（除夕）為止 */
function eveAfter(ym){const [y,m]=ym.split('.').map(Number);for(let Y=y;Y<=y+1;Y++){const t=CNY[Y];if(!t)continue;const ny=new Date(Y+'-'+t+'T00:00:00');const eve=new Date(ny-864e5);
  if(new Date(y,m-1,1)<ny)return eve;}return null;}
/* 季斗：報名月的法會＋往後兩個月；若報名時當月法會已過，則從下個月起算三個月 */
function douDue(c){return (c.dou||[]).map(d=>{
  if(d.type==='年斗'){const e=eveAfter(d.month);return {...d,dueMonth:e?e.getFullYear()+'.'+String(e.getMonth()+1).padStart(2,'0'):'',dueText:e?`${e.getFullYear()}/${e.getMonth()+1}/${e.getDate()}（除夕）`:'—'};}
  const st=d.after?shift(d.month,1):d.month,last=shift(st,2);return {...d,dueMonth:last,dueText:`${last} 法會後`,from:st};
}).sort((a,b)=>a.dueMonth<b.dueMonth?1:-1);}
function douNotes(cs,M){const next=shift(M,1);
  const notes=[];cs.forEach(c=>{['年斗','季斗'].forEach(tp=>{const d=douDue(c).find(x=>x.type===tp);if(!d||!d.dueMonth)return;
    if(tp==='年斗'&&d.dueMonth<M)notes.push({c,d,lv:'over',txt:`今年年斗還沒續（${d.dueText}已到期）`});
    else if(d.dueMonth<M&&d.dueMonth>=shift(M,-2))notes.push({c,d,lv:'over',txt:`${tp}已到期（${d.dueText}），還沒續`});
    else if(d.dueMonth===M)notes.push({c,d,lv:'now',txt:tp==='季斗'?'本月最後一期，提醒續斗':`年斗將於 ${d.dueText} 到期`});
    else if(d.dueMonth===next||(tp==='年斗'&&d.dueMonth===shift(M,2)))notes.push({c,d,lv:'soon',txt:tp==='季斗'?'下個月最後一期':`年斗將於 ${d.dueText} 到期`});});});
  notes.sort((a,b)=>({over:0,now:1,soon:2}[a.lv]-{over:0,now:1,soon:2}[b.lv]));
  return notes;}

  const CT=[['dou','斗燈到期',notes.filter(n=>n.lv!=='over').length],['sug','建議聯繫',suggest.length],['bday','本月生日',bday.length],['all','全部客戶',cs.length]];

function render(){
  if(!S.token){renderLogin();return;}
  const d=S.tab==='all'?S.all:S.me;

  $('#root').innerHTML=shell(inner);
  const card=document.querySelector('.card');if(card){theme(card,+card.dataset.rank);tilt();}
  if(S.me)setTint(rankOf(S.me.rank,S.me.cum));
  countUp();
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.c-bar i').forEach(i=>i.style.width=i.dataset.w+'%')));
  $('#out').onclick=logout;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(S.tab===b.dataset.t)return;S.tab=b.dataset.t;firstPaint=true;load(true);scrollTo({top:0});});
  const pm=$('#pm'),nm=$('#nm');
  if(pm)pm.onclick=()=>{S.month=shift(S.month,-1);S.me=null;S.all=null;load(true);};
  if(nm)nm.onclick=()=>{if(S.month>=nowMonth())return;S.month=shift(S.month,1);S.me=null;S.all=null;load(true);};
  const rt=$('#retry');if(rt)rt.onclick=()=>load(false);
  document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{S.ctab=b.dataset.ct;render();});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.tab='cust';S.ctab=b.dataset.go;firstPaint=true;render();load(false);scrollTo({top:0});});

/* 上次的資料先存在手機裡，打開馬上顯示，再背景更新 */
function lcKey(){return 'perfc_'+S.name;}
function lcGet(k){try{const o=JSON.parse(localStorage.getItem(lcKey())||'{}');return o[k];}catch(e){return null;}}
function lcPut(k,v){try{const o=JSON.parse(localStorage.getItem(lcKey())||'{}');o[k]=v;localStorage.setItem(lcKey(),JSON.stringify(o));}catch(e){}}
function lcClear(){try{Object.keys(localStorage).filter(k=>k.indexOf('perfc_')===0).forEach(k=>localStorage.removeItem(k));}catch(e){}}
async function load(clear){
  if(!S.token)return;const id=++S.req;
  const tab=S.tab,month=S.month;
  if(clear){S.net=false;
    if(tab==='all'){if(!S.all)S.all=lcGet('all_'+month)||null;}else if(!S.me){S.me=lcGet('me_'+month)||null;}
    if(!(S.cust&&S.cust[month])){const c=lcGet('cu_'+month);if(c){S.cust=S.cust||{};S.cust[month]=c;}}
    render();}
  loadCfg();loadPend();
  const wantCust=tab==='cust'||(tab==='month'&&month>=nowMonth());
  const pc=wantCust?api({action:'perfCustomers',token:S.token,month}).catch(()=>null):null;
  try{
    const r=await api({action:tab==='all'?'perfAll':'perfMe',token:S.token,month});
    if(id!==S.req)return;
    if(r&&r.relogin){expire();return;}
    if(!r||!r.ok)throw new Error(r&&r.err||'bad');
    if(tab==='all'){S.all=r;lcPut('all_'+month,r);}else{S.me=r;if(r.name)S.name=r.name;lcPut('me_'+month,r);}
    S.net=false;render();
  }catch(e){if(id!==S.req)return;S.net=true;render();}
  if(pc){const c=await pc;if(id!==S.req)return;if(c&&c.ok){S.cust=S.cust||{};S.cust[month]=c.customers||[];lcPut('cu_'+month,S.cust[month]);render();}}
}
function startTimer(){clearInterval(S.timer);S.timer=setInterval(()=>{if(S.token&&!document.hidden&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))load(false);},60000);}
function clearSess(){setTint(1);firstPaint=true;clearInterval(S.timer);S.token='';S.me=null;S.all=null;S.cust={};S.tab='month';try{sessionStorage.removeItem('perf3');}catch(e){}}
function expire(){clearSess();renderLogin('登入已逾時，請重新登入');}
async function logout(){const t=S.token;lcClear();clearSess();renderLogin();toast('已登出');try{await api({action:'perfLogout',token:t});}catch(e){}}

/* ====== 手機鍵盤：把正在填的欄位（連同標題）捲到可見區中央 ====== */
function centerField(el){
  const box=el.closest('.field')||el,vv=window.visualViewport,h=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0;
  const r=box.getBoundingClientRect(),d=(r.top+r.height/2)-(top+h/2);
  if(Math.abs(d)>8)window.scrollBy({top:d,behavior:'smooth'});
}
document.addEventListener('focusin',e=>{if(e.target.matches('input'))setTimeout(()=>centerField(e.target),300);});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const a=document.activeElement;if(a&&a.matches('input'))centerField(a);});

const DCUM={};

function dAmt(n,m){const names=Object.keys(DCUM),i=names.indexOf(n),k=m===nowMonth()?1:(m<nowMonth()?.85:0);return Math.round((420000-i*19000)*k/100)*100;}
function dRank(n){return RANKS[rankOf('',DCUM[n])].k;}
async function demo(b){
  await new Promise(r=>setTimeout(r,350));
  const now=new Date().toISOString();
  if(b.action==='perfLogin'){if(!DCUM[b.name])return{ok:false,err:'帳號或密碼不對'};const t='d'+Date.now();DSESS[t]={name:b.name,role:b.name==='蕭竣方'?'管理':'老師'};return{ok:true,token:t,name:b.name,role:DSESS[t].role};}
  if(b.action==='perfLogout'){delete DSESS[b.token];return{ok:true};}
  const s=DSESS[b.token];if(!s)return{ok:false,relogin:true};
  if(b.action==='perfMe'){const a=dAmt(s.name,b.month);const w=[.3,.25,.2,.15,.1],ks=['補財','還陰債','年斗','祭改','普桌'],pr=[3000,6000,10000,3000,2000];
    const items=a?ks.map((k,i)=>({k,n:Math.max(1,Math.round(a*w[i]/pr[i])),a:Math.round(a*w[i])})):[];
    const down=[];(function walk(n){Object.keys(DSP).forEach(c=>{if(DSP[c]===n&&!down.find(x=>x.name===c)){down.push({name:c,rank:dRank(c),amount:dAmt(c,b.month)});walk(c);}});})(s.name);

function seasonOf(t){const i=TERMS.findIndex(x=>x[0]===t);return ['冬','冬','春','春','春','春','春','春','夏','夏','夏','夏','夏','夏','秋','秋','秋','秋','秋','秋','冬','冬','冬','冬'][i];}
let lastTerm='';
function whenHTML(){const d=new Date(),W='日一二三四五六';
  const hm=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `<div class="when"><span class="clock">${hm}</span><span class="wrow"><span>${ganzhiYear(d)}</span><span class="term">${currentTerm(d)}</span><span>${d.getMonth()+1}月${d.getDate()}日 週${W[d.getDay()]}</span></span></div>`;}
function applyTerm(){const t=currentTerm(new Date());if(t===lastTerm)return;lastTerm=t;const bg=document.getElementById('termbg');
  bg.style.setProperty('--termfall',TERM_FALL[seasonOf(t)]);bg.style.backgroundImage=TERM_IMG[t]?`url(${TERM_IMG[t]})`:TERM_FALL[seasonOf(t)];}
function hdateHTML(){const d=new Date(),W='日一二三四五六';return `<b class="num">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</b><span>${currentTerm(d)}・${d.getMonth()+1}/${d.getDate()}（${W[d.getDay()]}）</span>`;}
function tickClock(){document.querySelectorAll('.when').forEach(w=>{w.outerHTML=whenHTML();});document.querySelectorAll('.hdate').forEach(h=>h.innerHTML=hdateHTML());applyTerm();}
setInterval(tickClock,15000);

/* ====== 驚艷層的程式 ====== */
let firstPaint=true;
function setTint(i){const r=RANKS[i]||RANKS[1],st=document.documentElement.style;
  st.setProperty('--tint',`color-mix(in srgb,${r.glow} 70%,#e8cf98)`);st.setProperty('--tint2',`color-mix(in srgb,${r.main} 34%,#f3dfb0)`);}
function countUp(){if(!firstPaint||!document.querySelector('[data-n]'))return;firstPaint=false;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  document.querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n||0,t0=performance.now(),dur=1300;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=money(to*e);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);});}
function tilt(){const card=document.querySelector('.card');if(!card)return;
  const set=(x,y)=>{card.style.transform=`rotateY(${x*9}deg) rotateX(${-y*9}deg)`;card.style.setProperty('--hx',(50+x*45)+'%');card.style.setProperty('--hy',(40+y*45)+'%');card.style.setProperty('--hp',(50+x*50)+'%');};
  card.onpointermove=e=>{const r=card.getBoundingClientRect();set((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5);};
  card.onpointerleave=()=>set(0,0);}
window.addEventListener('deviceorientation',e=>{const card=document.querySelector('.card');if(!card||e.gamma==null)return;
  const x=Math.max(-1,Math.min(1,e.gamma/30))/2,y=Math.max(-1,Math.min(1,(e.beta-45)/30))/2;
  card.style.transform=`rotateY(${x*9}deg) rotateX(${-y*9}deg)`;card.style.setProperty('--hx',(50+x*45)+'%');card.style.setProperty('--hy',(40+y*45)+'%');card.style.setProperty('--hp',(50+x*50)+'%');});
function rite(){const d=document.createElement('div');d.className='rite';d.innerHTML=crest()+'<i class="ring"></i><i class="ring b"></i><p>開啟會員卡</p>';document.body.appendChild(d);setTimeout(()=>d.remove(),1900);}
/* 金粉 */
(function(){const c=document.getElementById('dust');if(!c||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const g=c.getContext('2d');let W,H,P=[];
  const rs=()=>{W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;};rs();addEventListener('resize',rs);
  for(let i=0;i<34;i++)P.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.00008+Math.random()*.00022,a:Math.random()*6.28,s:.004+Math.random()*.01});
  (function f(){g.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;p.a+=p.s;if(p.y<-.02){p.y=1.02;p.x=Math.random();}
    const al=.35+.35*Math.sin(p.a),x=(p.x+Math.sin(p.a*.3)*.01)*W,y=p.y*H,r=p.r*devicePixelRatio;
    const gr=g.createRadialGradient(x,y,0,x,y,r*4);gr.addColorStop(0,`rgba(255,240,190,${al})`);gr.addColorStop(.4,`rgba(214,172,82,${al*.6})`);gr.addColorStop(1,'rgba(214,172,82,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r*4,0,6.29);g.fill();});requestAnimationFrame(f);})();})();

applyTerm();
if(S.token){load(true);startTimer();}else renderLogin();
